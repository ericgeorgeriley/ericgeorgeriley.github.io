<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MakeFast — Living Archipelago</title>
<style>
  :root{
    --ink:#18313a;
    --ink-soft:#42616a;
    --paper:#fff7de;
    --paper-2:#f2e7c5;
    --cream:#fffdf1;
    --sea:#65bdd1;
    --sea-dark:#2d7e9a;
    --sea-deep:#1d5d7a;
    --sky:#9bd8e2;
    --grass:#83bf6a;
    --grass-dark:#4f8b56;
    --sand:#e7ce82;
    --wood:#a86d45;
    --wood-dark:#704630;
    --coral:#df7c68;
    --gold:#e5b54e;
    --red:#c55c57;
    --shadow:rgba(20,47,56,.18);
    --pixel: 2px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#173a4a;color:var(--ink);font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;overflow:hidden}
  button,input,select,textarea{font:inherit}
  button{touch-action:manipulation}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#d8f3ea 0,#d8f3ea 48%,#9bd8e2 48%,#9bd8e2 100%)}
  .topbar{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--paper);border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--shadow);z-index:10;min-height:70px}
  .brand{display:flex;align-items:center;gap:10px;min-width:190px}
  .brandmark{width:43px;height:43px;position:relative;background:var(--sea);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--wood-dark);overflow:hidden}
  .brandmark:before{content:"";position:absolute;left:6px;right:6px;bottom:7px;height:8px;background:#fff;border:3px solid var(--ink);clip-path:polygon(0 0,100% 0,78% 100%,20% 100%)}
  .brandmark:after{content:"";position:absolute;left:19px;top:6px;width:3px;height:19px;background:var(--ink);box-shadow:7px 6px 0 -1px var(--cream)}
  .brand h1{font-size:18px;line-height:1;margin:0;letter-spacing:-1px}.brand small{display:block;color:var(--ink-soft);font-size:9px;margin-top:4px}
  .phase-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);min-width:145px}
  .phase-dot{width:11px;height:11px;border:2px solid var(--ink);background:var(--grass);box-shadow:2px 2px 0 var(--shadow)}
  .phase-chip.sea .phase-dot{background:var(--sea)}
  .phase-chip.arrived .phase-dot{background:var(--gold)}
  .phase-chip b{display:block;font-size:11px}.phase-chip span{display:block;font-size:9px;color:var(--ink-soft);margin-top:2px}
  .timerbox{margin-left:auto;text-align:right;min-width:185px}.timerbox .timer{font-weight:900;font-size:23px;letter-spacing:-1px}.timerbox .sub{font-size:9px;color:var(--ink-soft);margin-top:2px}
  .tiny-btn{border:3px solid var(--ink);background:var(--cream);color:var(--ink);padding:8px 10px;border-radius:7px;box-shadow:3px 3px 0 var(--shadow);font-weight:800;font-size:10px;cursor:pointer}.tiny-btn:hover{transform:translateY(-1px)}.tiny-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

  .main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px;background:linear-gradient(#bfe9e4,#89cfda)}
  .stage-wrap{min-width:0;min-height:0;position:relative;background:#1c657c;border:4px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(22,49,58,.22);overflow:hidden}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
  .stage-label{position:absolute;top:10px;left:10px;background:rgba(255,247,222,.94);border:3px solid var(--ink);padding:6px 8px;border-radius:6px;box-shadow:3px 3px 0 rgba(22,49,58,.18);font-size:10px;pointer-events:none}
  .stage-label b{font-size:11px}
  .toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--paper);border:3px solid var(--ink);border-radius:7px;box-shadow:4px 4px 0 rgba(22,49,58,.2);padding:9px 12px;font-size:10px;transition:.22s;pointer-events:none;max-width:70%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .panel{min-height:0;background:var(--paper);border:4px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(22,49,58,.22);display:flex;flex-direction:column;overflow:hidden}
  .panel-head{padding:12px 13px 9px;border-bottom:3px solid var(--ink);background:#fff4c8}.panel-head h2{font-size:13px;margin:0 0 4px}.panel-head p{font-size:9px;color:var(--ink-soft);margin:0;line-height:1.45}
  .panel-body{padding:12px;overflow:auto;min-height:0;scrollbar-width:thin;flex:1}
  .section{margin-bottom:14px}.section:last-child{margin-bottom:0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;color:var(--ink-soft)}
  .card{background:var(--cream);border:3px solid var(--ink);border-radius:8px;padding:10px;box-shadow:3px 3px 0 var(--shadow);margin-bottom:8px}.card.selected{background:#e2f2d2;outline:3px solid rgba(255,255,255,.8);outline-offset:-7px}.card h3{font-size:11px;margin:0 0 5px}.card p{font-size:9px;line-height:1.45;margin:0;color:var(--ink-soft)}
  .row{display:flex;gap:7px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
  .big-btn{width:100%;border:3px solid var(--ink);background:var(--grass);color:#112d34;padding:11px 12px;border-radius:8px;box-shadow:4px 4px 0 var(--wood-dark);font-weight:1000;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.4px}.big-btn.secondary{background:var(--sea)}.big-btn.warm{background:var(--gold)}.big-btn.danger{background:#efb5a9}.big-btn.ghost{background:var(--cream);box-shadow:3px 3px 0 var(--shadow)}.big-btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}.big-btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--wood-dark)}
  .ratio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ratio{border:3px solid var(--ink);background:#fff;padding:8px 5px;border-radius:7px;text-align:center;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.ratio.active{background:#dff1cf;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}.ratio b{font-size:11px;display:block}.ratio span{font-size:8px;color:var(--ink-soft);display:block;margin-top:2px}
  .meter{height:18px;border:3px solid var(--ink);background:#fff;border-radius:6px;overflow:hidden;position:relative}.meter-fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sea) 0,var(--sea) 12px,#8ed4df 12px,#8ed4df 16px);transition:width .4s}.meter-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;text-shadow:1px 1px #fff}
  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini{border:3px solid var(--ink);background:#fff;padding:8px 5px;border-radius:7px;text-align:center;cursor:pointer;font-size:9px;box-shadow:2px 2px 0 var(--shadow)}.mini:hover{background:#e9f7f5}
  .find{display:flex;gap:8px;align-items:flex-start;padding:8px;border:3px solid var(--ink);background:#fff;border-radius:7px;margin-bottom:6px}.find-icon{width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--ink);background:#e6d39b;font-size:16px;flex:0 0 auto}.find b{font-size:9px;display:block}.find small{font-size:8px;color:var(--ink-soft);line-height:1.35;display:block;margin-top:2px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:#fff;border:3px solid var(--ink);border-radius:7px;padding:8px}.stat b{font-size:14px;display:block}.stat span{font-size:8px;color:var(--ink-soft)}
  .session{display:grid;grid-template-columns:48px 1fr 52px;gap:7px;align-items:center;font-size:8px;border-bottom:2px dashed #d8cda8;padding:6px 0}.session:last-child{border-bottom:0}.session .bar{height:8px;border:2px solid var(--ink);background:#fff}.session .bar>i{display:block;height:100%;background:var(--sea)}
  .pill{display:inline-flex;align-items:center;border:2px solid var(--ink);background:#fff;padding:3px 5px;border-radius:999px;font-size:8px;margin:2px 3px 2px 0}
  .stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stock-item{border:2px solid var(--ink);background:#fff;padding:6px;border-radius:6px;font-size:8px}.stock-item b{display:block;font-size:11px}.stock-item span{color:var(--ink-soft)}
  .project-card{border:3px solid var(--ink);background:#fff;border-radius:8px;padding:9px;margin-bottom:8px;box-shadow:3px 3px 0 var(--shadow)}.project-card.done{background:#e7f2d9}.project-card h3{font-size:10px;margin:0 0 4px}.project-card p{font-size:8px;margin:0 0 6px;color:var(--ink-soft);line-height:1.4}
  .project-meter{height:10px;border:2px solid var(--ink);background:#fff;border-radius:4px;overflow:hidden;margin:5px 0}.project-meter i{display:block;height:100%;background:var(--grass);width:0}
  .materials{display:flex;flex-wrap:wrap;gap:4px}.material{display:inline-flex;gap:4px;align-items:center;border:2px solid var(--ink);background:var(--cream);padding:3px 5px;border-radius:5px;font-size:8px}.material.met{background:#dff1cf}.material button{border:0;background:var(--gold);font-weight:900;cursor:pointer;padding:1px 4px;margin-left:2px}
  .resident-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}.resident{display:flex;gap:7px;align-items:center;border:2px solid var(--ink);background:#fff;border-radius:6px;padding:6px;font-size:8px}.outfit-dot{width:17px;height:17px;border:2px solid var(--ink);border-radius:3px;flex:0 0 auto}
  .traffic-list{display:grid;gap:6px}.traffic{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--ink);background:#fff;border-radius:7px;padding:7px;font-size:8px}.traffic .vessel-icon{width:28px;height:22px;display:grid;place-items:center;background:#dff1cf;border:2px solid var(--ink);border-radius:4px;flex:0 0 auto}.traffic b{font-size:9px}.traffic span{color:var(--ink-soft);line-height:1.35;display:block;margin-top:2px}.world-log{border-left:3px solid #cbbd91;padding:3px 0 3px 8px;margin-bottom:6px;font-size:8px}.world-log b{display:block;font-size:9px}.world-log span{color:var(--ink-soft);line-height:1.35}
  .site-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.site-choice{border:3px solid var(--ink);background:#fff;border-radius:7px;padding:9px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.site-choice:hover{background:#edf7dc}.site-choice b{display:block;font-size:10px}.site-choice span{display:block;font-size:8px;color:var(--ink-soft);margin-top:3px}
  .muted{color:var(--ink-soft);font-size:8px;line-height:1.4}.divider{height:3px;background:var(--ink);opacity:.15;margin:10px 0}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:4px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom);z-index:11}.navbtn{border:0;border-right:2px solid #c9b98e;background:var(--paper);padding:8px 4px;cursor:pointer;color:var(--ink);font-weight:900;font-size:9px}.navbtn:last-child{border-right:0}.navbtn.active{background:#dff1cf;box-shadow:inset 0 4px 0 var(--grass-dark)}.navbtn span{display:block;font-size:15px;margin-bottom:2px}

  .modal-back{position:fixed;inset:0;background:rgba(14,36,45,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-back.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 rgba(0,0,0,.25);padding:16px}.modal h2{font-size:16px;margin:0 0 7px}.modal p{font-size:10px;line-height:1.5;color:var(--ink-soft)}.modal .notice{background:#fff0ce;border:3px solid var(--ink);padding:9px;border-radius:7px;font-size:9px;line-height:1.45;margin:10px 0}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}
  .choice{border:3px solid var(--ink);background:#fff;border-radius:7px;padding:9px;margin-top:7px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}.choice:hover{background:#edf7dc}.choice b{font-size:10px;display:block}.choice span{font-size:8px;color:var(--ink-soft);display:block;margin-top:3px;line-height:1.4}

  .game-hud{position:absolute;inset:10px 10px auto auto;background:rgba(255,247,222,.94);border:3px solid var(--ink);border-radius:7px;padding:7px 9px;font-size:9px;box-shadow:3px 3px 0 var(--shadow);display:none}.game-hud.show{display:block}
  .game-hud b{font-size:11px}.game-hud .gamebar{width:120px;height:10px;border:2px solid var(--ink);background:#fff;margin-top:4px}.game-hud .gamebar i{display:block;height:100%;background:var(--coral);width:100%}
  .event-card{background:#e8f5ed;border:3px solid var(--ink);border-radius:8px;padding:10px;box-shadow:3px 3px 0 var(--shadow);margin-bottom:8px;position:relative;overflow:hidden}.event-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sea)}.event-card h3{font-size:11px;margin:0 0 4px;padding-left:5px}.event-card p{font-size:9px;line-height:1.45;margin:0;padding-left:5px;color:var(--ink-soft)}
  .activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.activity{border:3px solid var(--ink);background:#fff;border-radius:8px;padding:9px;text-align:left;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.activity:hover{background:#edf7dc;transform:translateY(-1px)}.activity b{display:block;font-size:9px}.activity span{display:block;font-size:8px;color:var(--ink-soft);line-height:1.3;margin-top:3px}
  .sea-log{display:flex;gap:7px;align-items:flex-start;border-bottom:2px dashed #d8cda8;padding:6px 0}.sea-log:last-child{border-bottom:0}.sea-log i{font-style:normal;font-size:14px;line-height:1}.sea-log span{font-size:8px;color:var(--ink-soft);line-height:1.35}.sea-log b{font-size:8px;display:block;color:var(--ink)}
  .sheet-toggle{display:none;position:absolute;left:50%;top:3px;transform:translateX(-50%);width:64px;height:20px;border:0;background:transparent;cursor:pointer;z-index:2}.sheet-toggle:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--ink);opacity:.28;margin:auto}.sheet-toggle span{display:none}
  .scene-caption{position:absolute;left:10px;bottom:10px;display:none;min-width:190px;max-width:min(70%,340px);background:rgba(255,247,222,.94);border:3px solid var(--ink);padding:7px 9px;border-radius:7px;box-shadow:3px 3px 0 rgba(22,49,58,.18);font-size:9px;pointer-events:none}.scene-caption.show{display:block}.scene-caption b{display:block;font-size:11px;margin-bottom:2px}.scene-caption span{color:var(--ink-soft);line-height:1.35}
  .map-controls{position:absolute;right:10px;top:10px;display:none;gap:5px;z-index:6}.map-controls.show{display:flex}.map-controls button{width:34px;height:34px;border:3px solid var(--ink);background:var(--paper);border-radius:7px;box-shadow:3px 3px 0 var(--shadow);font-weight:1000;cursor:pointer;color:var(--ink)}.map-controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
  .rhythm-picker{background:#fff;border:3px solid var(--ink);border-radius:9px;padding:12px;box-shadow:3px 3px 0 var(--shadow)}.rhythm-readout{text-align:center;margin-bottom:10px}.rhythm-readout b{font-size:24px;letter-spacing:-1px;display:block}.rhythm-readout span{font-size:9px;color:var(--ink-soft)}.rhythm-picker input[type=range]{width:100%;accent-color:var(--grass-dark);height:28px}.rhythm-scale{display:flex;justify-content:space-between;gap:3px;font-size:7px;color:var(--ink-soft);margin-top:2px}.rhythm-scale span{text-align:center;flex:1}.rhythm-help{font-size:8px;color:var(--ink-soft);line-height:1.45;margin-top:8px}
  .onboard-viewport{overflow:hidden;margin-top:10px}.onboard-track{display:flex;width:200%;transition:transform .28s ease}.onboard-track.step-2{transform:translateX(-50%)}.onboard-step{width:50%;flex:0 0 50%;padding:2px 3px}.onboard-dots{display:flex;justify-content:center;gap:6px;margin:9px 0 2px}.onboard-dot{width:7px;height:7px;border:2px solid var(--ink);background:#fff;border-radius:50%}.onboard-dot.active{background:var(--grass)}

  @media (max-width:900px){
    html,body{height:100%;overflow:hidden;overscroll-behavior:none}.app{height:100dvh;min-height:100dvh;grid-template-rows:auto minmax(0,1fr) auto}.topbar{position:relative;min-height:58px}.brand{min-width:0}.brand small{display:none}.phase-chip{display:none}.timerbox{min-width:120px}.timerbox .timer{font-size:18px}
    .main{position:relative;display:block;min-height:0;padding:0;background:linear-gradient(#bfe9e4,#89cfda);overflow:hidden}.stage-wrap{position:absolute;margin:0;min-width:0;min-height:0;border-radius:9px}.stage-wrap canvas{touch-action:none}.panel{position:absolute;left:7px;right:7px;bottom:7px;height:min(56dvh,520px);max-height:calc(100% - 14px);z-index:15;border-radius:12px;transition:transform .24s ease;will-change:transform}.panel.sheet-collapsed{transform:translateY(calc(100% - 48px))}.panel-head{min-height:48px;padding:18px 44px 8px 12px;cursor:pointer;user-select:none}.panel-head h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-head p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-body{padding:10px;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}.sheet-toggle{display:block}.bottomnav{position:relative;z-index:22}.scene-caption{bottom:58px;max-width:calc(100% - 24px)}
  }
  @media (max-width:520px){.topbar{gap:5px;padding:6px 7px}.brandmark{width:34px;height:34px}.brand h1{font-size:14px}.tiny-btn{padding:6px 7px;font-size:8px}.timerbox{min-width:100px}.timerbox .timer{font-size:16px}.timerbox .sub{display:none}.panel-body{padding:8px}.mini-grid{grid-template-columns:1fr 1fr 1fr}.map-controls{right:7px;top:7px}.map-controls button{width:32px;height:32px}.scene-caption{font-size:8px}.scene-caption b{font-size:10px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandmark" aria-hidden="true"></div><div><h1>MAKEFAST</h1><small>EVERY FAST GOES SOMEWHERE</small></div></div>
    <div class="phase-chip" id="phaseChip"><div class="phase-dot"></div><div><b id="phaseName">IN HARBOUR</b><span id="phaseHint">Choose your next voyage</span></div></div>
    <div class="timerbox"><div class="timer" id="headerTimer">00:00:00</div><div class="sub" id="headerSub">time ashore</div></div>
    <button class="tiny-btn" id="soundBtn" title="Toggle sound">SOUND ON</button>
  </header>

  <main class="main">
    <section class="stage-wrap" id="stageWrap">
      <canvas id="game" width="640" height="360" aria-label="MakeFast game world"></canvas>
      <div class="stage-label" id="stageLabel"><b>HOME HARBOUR</b><br><span>the world is happy when you return</span></div>
      <div class="scene-caption" id="sceneCaption"></div>
      <div class="map-controls" id="mapControls" aria-label="Chart controls"><button id="mapZoomOut" title="Zoom out">−</button><button id="mapReset" title="Reset chart">⌂</button><button id="mapZoomIn" title="Zoom in">+</button></div>
      <div class="game-hud" id="gameHud"><b id="gameHudTitle">REEF RUN</b><div id="gameHudText">0 pts</div><div class="gamebar"><i id="gameHudBar"></i></div></div>
      <div class="toast" id="toast"></div>
    </section>

    <aside class="panel" id="infoPanel">
      <div class="panel-head" id="panelHead"><button class="sheet-toggle" id="sheetToggle" aria-label="Show or hide panel"><span>toggle</span></button><h2 id="panelTitle">Home Harbour</h2><p id="panelSubtitle">Plan your next crossing, or spend a little time ashore.</p></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <nav class="bottomnav" aria-label="Game sections">
    <button class="navbtn active" data-view="harbour"><span>⌂</span>HARBOUR</button>
    <button class="navbtn" data-view="chart"><span>⌁</span>CHART</button>
    <button class="navbtn" data-view="voyage"><span>◢</span>VOYAGE</button>
    <button class="navbtn" data-view="log"><span>▤</span>LOG</button>
    <button class="navbtn" data-view="settings"><span>⚙</span>SETTINGS</button>
  </nav>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>

<script>
(()=>{
'use strict';

const SAVE_KEY='makefast_save_v1';
const VERSION=8.0;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const lerp=(a,b,t)=>a+(b-a)*t;
const nowReal=()=>Date.now();
const fmt2=n=>String(n).padStart(2,'0');
const fmtDuration=(ms,short=false)=>{
  ms=Math.max(0,ms); const total=Math.floor(ms/1000); const h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
  return short?`${h}h ${fmt2(m)}m`:`${fmt2(h)}:${fmt2(m)}:${fmt2(s)}`;
};
const fmtClock=ts=>formatClockInZone(ts,(typeof state!=='undefined'&&state?.settings?.timezone)||DEFAULT_TIMEZONE);
const fmtDate=ts=>new Date(ts).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'});
const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

function validTimeZone(tz){try{new Intl.DateTimeFormat('en-GB',{timeZone:tz}).format();return true}catch(e){return false}}
function formatClockInZone(ts,tz){try{return new Intl.DateTimeFormat([],{timeZone:validTimeZone(tz)?tz:DEFAULT_TIMEZONE,hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}catch(e){return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}}
function zonedParts(ts=gameNow()){
  const tz=validTimeZone(state?.settings?.timezone)?state.settings.timezone:DEFAULT_TIMEZONE;
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ts));
  const obj={};parts.forEach(p=>{if(p.type!=='literal')obj[p.type]=p.value});
  return {year:+obj.year,month:+obj.month,day:+obj.day,hour:+obj.hour,minute:+obj.minute,second:+obj.second,key:`${obj.year}-${obj.month}-${obj.day}`,timezone:tz};
}

function startRandomMinigame(seconds=75){
  if(state.phase!=='fasting'||!state.voyage)return;
  const types=Object.keys(MINIGAME_META), boat=BOAT_TYPES.find(b=>b.id===state.boat.type)||BOAT_TYPES[0];
  let type=types[(state.totalMinigames+state.voyage.minigamesPlayed)%types.length];
  if(Math.random()<.38&&types.includes(boat.bias))type=boat.bias;
  const actual=state.sim?.active?Math.min(seconds,30):seconds; startMinigame(type,actual);
}

function startMinigame(type,seconds,opts={}){
  if(!state.voyage)return;const plugin=MINIGAME_PLUGINS[type]||MINIGAME_PLUGINS.reef;state.totalMinigames++;state.voyage.minigamesPlayed++;save();const common={type,duration:seconds*1000,started:performance.now(),score:0,done:false,title:plugin.title,eventId:opts.eventId||null,rewardKind:opts.rewardKind||null};minigame=plugin.create(common);state.activeView='voyage';if(window.matchMedia('(max-width:900px)').matches){mobilePanelCollapsed=true;syncMobilePanel()}$('#gameHud').classList.add('show');$('#gameHudTitle').textContent=minigame.title;renderUI();
}
function endMinigame(reason='done'){
  if(!minigame)return; const g=minigame,score=g.score, success=score>0;
  if(reason!=='leave'&&g.eventId&&state.voyage)resolveEncounterEvent(g.eventId,score);
  if(reason!=='leave'&&success&&state.voyage&&state.voyage.discoveries.length<5){
    const threshold=MINIGAME_PLUGINS[g.type]?.rewardThreshold??2;
    if(score>=threshold){const desired=g.rewardKind||null; const chance=g.eventId?.length?1:Math.min(.72,.22+score*.055); if(Math.random()<chance)addDiscovery(desired)}
  }
  minigame=null; $('#gameHud').classList.remove('show'); save(); renderUI();
  toast(success?contentLine('copy.minigames.success',{score}):contentLine('copy.minigames.quiet'));
  if(reason!=='leave'&&state.phase==='fasting'&&state.voyage){setTimeout(()=>{
    showModal(`<h2>Back on course</h2><p>The sea is quiet again.</p><div class="choice" id="feelFine"><b>Let her sail</b><span>Return to the voyage.</span></div><div class="choice" id="feelAgain"><b>Another diversion</b><span>Take the helm for another short encounter.</span></div><div class="choice" id="feelEat"><b>Make for harbour</b><span>Bring the boat in and begin the eating window.</span></div>`,false);
    $('#feelFine').onclick=closeModal; $('#feelAgain').onclick=()=>{closeModal();startRandomMinigame(75)}; $('#feelEat').onclick=()=>{closeModal();earlyDockPrompt()};
  },180)}
}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*canvas.width;pointer.y=(e.clientY-r.top)/r.height*canvas.height;pointer.down=true;if(minigame)minigamePointer('down',pointer.x,pointer.y);else if(state.activeView==='chart'){chartView.dragging=true;chartView.lastX=e.clientX;chartView.lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId)}});

function minigamePointer(type,x,y){if(!minigame)return;MINIGAME_PLUGINS[minigame.type]?.pointer?.(minigame,type,x,y)}
function signalInput(i){if(!minigame||minigame.type!=='signal'||minigame.phase!=='input')return;minigame.input.push(i);const pos=minigame.input.length-1;if(i!==minigame.seq[pos]){minigame.phase='pause';minigame.input=[];minigame.nextAt=performance.now()+800;return}if(minigame.input.length===minigame.seq.length){minigame.score++;minigame.round++;minigame.phase='pause';minigame.nextAt=performance.now()+650;beep('soft')}}
function soundingTap(x,y){
  if(!minigame||minigame.type!=='soundings')return; const left=128,top=88,cw=64,ch=58; if(x<left||x>left+cw*6||y<top||y>top+ch*4)return; const gx=Math.floor((x-left)/cw),gy=Math.floor((y-top)/ch); const d=Math.hypot(gx-minigame.target.x,gy-minigame.target.y); minigame.pings.push({gx,gy,d,at:performance.now()});
