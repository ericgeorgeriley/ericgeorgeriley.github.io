<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MakeFast — Voyage Edition</title>
<style>
  :root{
    --ink:#18313a;
    --ink-soft:#42616a;
    --paper:#fff7de;
    --paper-2:#f2e7c5;
    --cream:#fffdf1;
    --sea:#65bdd1;
    --sea-dark:#2d7e9a;
    --sea-deep:#1d5d7a;
    --sky:#9bd8e2;
    --grass:#83bf6a;
    --grass-dark:#4f8b56;
    --sand:#e7ce82;
    --wood:#a86d45;
    --wood-dark:#704630;
    --coral:#df7c68;
    --gold:#e5b54e;
    --red:#c55c57;
    --shadow:rgba(20,47,56,.18);
    --pixel: 2px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#173a4a;color:var(--ink);font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;overflow:hidden}
  button,input,select,textarea{font:inherit}
  button{touch-action:manipulation}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#d8f3ea 0,#d8f3ea 48%,#9bd8e2 48%,#9bd8e2 100%)}
  .topbar{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--paper);border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--shadow);z-index:10;min-height:70px}
  .brand{display:flex;align-items:center;gap:10px;min-width:190px}
  .brandmark{width:43px;height:43px;position:relative;background:var(--sea);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--wood-dark);overflow:hidden}
  .brandmark:before{content:"";position:absolute;left:6px;right:6px;bottom:7px;height:8px;background:#fff;border:3px solid var(--ink);clip-path:polygon(0 0,100% 0,78% 100%,20% 100%)}
  .brandmark:after{content:"";position:absolute;left:19px;top:6px;width:3px;height:19px;background:var(--ink);box-shadow:7px 6px 0 -1px var(--cream)}
  .brand h1{font-size:18px;line-height:1;margin:0;letter-spacing:-1px}.brand small{display:block;color:var(--ink-soft);font-size:9px;margin-top:4px}
  .phase-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);min-width:145px}
  .phase-dot{width:11px;height:11px;border:2px solid var(--ink);background:var(--grass);box-shadow:2px 2px 0 var(--shadow)}
  .phase-chip.sea .phase-dot{background:var(--sea)}
  .phase-chip.arrived .phase-dot{background:var(--gold)}
  .phase-chip b{display:block;font-size:11px}.phase-chip span{display:block;font-size:9px;color:var(--ink-soft);margin-top:2px}
  .timerbox{margin-left:auto;text-align:right;min-width:185px}.timerbox .timer{font-weight:900;font-size:23px;letter-spacing:-1px}.timerbox .sub{font-size:9px;color:var(--ink-soft);margin-top:2px}
  .tiny-btn{border:3px solid var(--ink);background:var(--cream);color:var(--ink);padding:8px 10px;border-radius:7px;box-shadow:3px 3px 0 var(--shadow);font-weight:800;font-size:10px;cursor:pointer}.tiny-btn:hover{transform:translateY(-1px)}.tiny-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

  .main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px;background:linear-gradient(#bfe9e4,#89cfda)}
  .stage-wrap{min-width:0;min-height:0;position:relative;background:#1c657c;border:4px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(22,49,58,.22);overflow:hidden}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
  .stage-label{position:absolute;top:10px;left:10px;background:rgba(255,247,222,.94);border:3px solid var(--ink);padding:6px 8px;border-radius:6px;box-shadow:3px 3px 0 rgba(22,49,58,.18);font-size:10px;pointer-events:none}
  .stage-label b{font-size:11px}
  .toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--paper);border:3px solid var(--ink);border-radius:7px;box-shadow:4px 4px 0 rgba(22,49,58,.2);padding:9px 12px;font-size:10px;transition:.22s;pointer-events:none;max-width:70%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .panel{min-height:0;background:var(--paper);border:4px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(22,49,58,.22);display:flex;flex-direction:column;overflow:hidden}
  .panel-head{padding:12px 13px 9px;border-bottom:3px solid var(--ink);background:#fff4c8}.panel-head h2{font-size:13px;margin:0 0 4px}.panel-head p{font-size:9px;color:var(--ink-soft);margin:0;line-height:1.45}
  .panel-body{padding:12px;overflow:auto;min-height:0;scrollbar-width:thin;flex:1}
  .section{margin-bottom:14px}.section:last-child{margin-bottom:0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;color:var(--ink-soft)}
  .card{background:var(--cream);border:3px solid var(--ink);border-radius:8px;padding:10px;box-shadow:3px 3px 0 var(--shadow);margin-bottom:8px}.card.selected{background:#e2f2d2;outline:3px solid rgba(255,255,255,.8);outline-offset:-7px}.card h3{font-size:11px;margin:0 0 5px}.card p{font-size:9px;line-height:1.45;margin:0;color:var(--ink-soft)}
  .row{display:flex;gap:7px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
  .big-btn{width:100%;border:3px solid var(--ink);background:var(--grass);color:#112d34;padding:11px 12px;border-radius:8px;box-shadow:4px 4px 0 var(--wood-dark);font-weight:1000;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.4px}.big-btn.secondary{background:var(--sea)}.big-btn.warm{background:var(--gold)}.big-btn.danger{background:#efb5a9}.big-btn.ghost{background:var(--cream);box-shadow:3px 3px 0 var(--shadow)}.big-btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}.big-btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--wood-dark)}
  .ratio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ratio{border:3px solid var(--ink);background:#fff;padding:8px 5px;border-radius:7px;text-align:center;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.ratio.active{background:#dff1cf;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}.ratio b{font-size:11px;display:block}.ratio span{font-size:8px;color:var(--ink-soft);display:block;margin-top:2px}
  .meter{height:18px;border:3px solid var(--ink);background:#fff;border-radius:6px;overflow:hidden;position:relative}.meter-fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sea) 0,var(--sea) 12px,#8ed4df 12px,#8ed4df 16px);transition:width .4s}.meter-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;text-shadow:1px 1px #fff}
  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini{border:3px solid var(--ink);background:#fff;padding:8px 5px;border-radius:7px;text-align:center;cursor:pointer;font-size:9px;box-shadow:2px 2px 0 var(--shadow)}.mini:hover{background:#e9f7f5}
  .find{display:flex;gap:8px;align-items:flex-start;padding:8px;border:3px solid var(--ink);background:#fff;border-radius:7px;margin-bottom:6px}.find-icon{width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--ink);background:#e6d39b;font-size:16px;flex:0 0 auto}.find b{font-size:9px;display:block}.find small{font-size:8px;color:var(--ink-soft);line-height:1.35;display:block;margin-top:2px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:#fff;border:3px solid var(--ink);border-radius:7px;padding:8px}.stat b{font-size:14px;display:block}.stat span{font-size:8px;color:var(--ink-soft)}
  .session{display:grid;grid-template-columns:48px 1fr 52px;gap:7px;align-items:center;font-size:8px;border-bottom:2px dashed #d8cda8;padding:6px 0}.session:last-child{border-bottom:0}.session .bar{height:8px;border:2px solid var(--ink);background:#fff}.session .bar>i{display:block;height:100%;background:var(--sea)}
  .pill{display:inline-flex;align-items:center;border:2px solid var(--ink);background:#fff;padding:3px 5px;border-radius:999px;font-size:8px;margin:2px 3px 2px 0}
  .muted{color:var(--ink-soft);font-size:8px;line-height:1.4}.divider{height:3px;background:var(--ink);opacity:.15;margin:10px 0}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:4px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom);z-index:11}.navbtn{border:0;border-right:2px solid #c9b98e;background:var(--paper);padding:8px 4px;cursor:pointer;color:var(--ink);font-weight:900;font-size:9px}.navbtn:last-child{border-right:0}.navbtn.active{background:#dff1cf;box-shadow:inset 0 4px 0 var(--grass-dark)}.navbtn span{display:block;font-size:15px;margin-bottom:2px}

  .modal-back{position:fixed;inset:0;background:rgba(14,36,45,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-back.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 rgba(0,0,0,.25);padding:16px}.modal h2{font-size:16px;margin:0 0 7px}.modal p{font-size:10px;line-height:1.5;color:var(--ink-soft)}.modal .notice{background:#fff0ce;border:3px solid var(--ink);padding:9px;border-radius:7px;font-size:9px;line-height:1.45;margin:10px 0}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}
  .choice{border:3px solid var(--ink);background:#fff;border-radius:7px;padding:9px;margin-top:7px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}.choice:hover{background:#edf7dc}.choice b{font-size:10px;display:block}.choice span{font-size:8px;color:var(--ink-soft);display:block;margin-top:3px;line-height:1.4}

  .game-hud{position:absolute;inset:10px 10px auto auto;background:rgba(255,247,222,.94);border:3px solid var(--ink);border-radius:7px;padding:7px 9px;font-size:9px;box-shadow:3px 3px 0 var(--shadow);display:none}.game-hud.show{display:block}
  .game-hud b{font-size:11px}.game-hud .gamebar{width:120px;height:10px;border:2px solid var(--ink);background:#fff;margin-top:4px}.game-hud .gamebar i{display:block;height:100%;background:var(--coral);width:100%}
  .event-card{background:#e8f5ed;border:3px solid var(--ink);border-radius:8px;padding:10px;box-shadow:3px 3px 0 var(--shadow);margin-bottom:8px;position:relative;overflow:hidden}.event-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sea)}.event-card h3{font-size:11px;margin:0 0 4px;padding-left:5px}.event-card p{font-size:9px;line-height:1.45;margin:0;padding-left:5px;color:var(--ink-soft)}
  .activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.activity{border:3px solid var(--ink);background:#fff;border-radius:8px;padding:9px;text-align:left;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.activity:hover{background:#edf7dc;transform:translateY(-1px)}.activity b{display:block;font-size:9px}.activity span{display:block;font-size:8px;color:var(--ink-soft);line-height:1.3;margin-top:3px}
  .sea-log{display:flex;gap:7px;align-items:flex-start;border-bottom:2px dashed #d8cda8;padding:6px 0}.sea-log:last-child{border-bottom:0}.sea-log i{font-style:normal;font-size:14px;line-height:1}.sea-log span{font-size:8px;color:var(--ink-soft);line-height:1.35}.sea-log b{font-size:8px;display:block;color:var(--ink)}

  @media (max-width:900px){
    body{overflow:auto}.app{min-height:100%;height:auto;grid-template-rows:auto auto auto}.topbar{position:sticky;top:0}.brand{min-width:0}.brand small{display:none}.phase-chip{display:none}.timerbox{min-width:130px}.timerbox .timer{font-size:18px}
    .main{grid-template-columns:1fr;grid-template-rows:minmax(380px,56vh) auto}.panel{max-height:none}.bottomnav{position:sticky;bottom:0}
  }
  @media (max-width:520px){.topbar{gap:6px;padding:7px}.brandmark{width:36px;height:36px}.brand h1{font-size:15px}.tiny-btn{padding:6px 7px}.timerbox .sub{display:none}.main{padding:6px;gap:6px}.panel-body{padding:9px}.ratio-grid{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr 1fr 1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandmark" aria-hidden="true"></div><div><h1>MAKEFAST</h1><small>EVERY FAST GOES SOMEWHERE</small></div></div>
    <div class="phase-chip" id="phaseChip"><div class="phase-dot"></div><div><b id="phaseName">IN HARBOUR</b><span id="phaseHint">Choose your next voyage</span></div></div>
    <div class="timerbox"><div class="timer" id="headerTimer">00:00:00</div><div class="sub" id="headerSub">time ashore</div></div>
    <button class="tiny-btn" id="soundBtn" title="Toggle sound">SOUND ON</button>
  </header>

  <main class="main">
    <section class="stage-wrap" id="stageWrap">
      <canvas id="game" width="640" height="360" aria-label="MakeFast game world"></canvas>
      <div class="stage-label" id="stageLabel"><b>HOME HARBOUR</b><br><span>the world is happy when you return</span></div>
      <div class="game-hud" id="gameHud"><b id="gameHudTitle">REEF RUN</b><div id="gameHudText">0 pts</div><div class="gamebar"><i id="gameHudBar"></i></div></div>
      <div class="toast" id="toast"></div>
    </section>

    <aside class="panel">
      <div class="panel-head"><h2 id="panelTitle">Home Harbour</h2><p id="panelSubtitle">Plan your next crossing, or spend a little time ashore.</p></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <nav class="bottomnav" aria-label="Game sections">
    <button class="navbtn active" data-view="harbour"><span>⌂</span>HARBOUR</button>
    <button class="navbtn" data-view="chart"><span>⌁</span>CHART</button>
    <button class="navbtn" data-view="voyage"><span>◢</span>VOYAGE</button>
    <button class="navbtn" data-view="log"><span>▤</span>LOG</button>
    <button class="navbtn" data-view="settings"><span>⚙</span>SETTINGS</button>
  </nav>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>

<script>
(()=>{
'use strict';

const SAVE_KEY='makefast_save_v1';
const VERSION=1;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const lerp=(a,b,t)=>a+(b-a)*t;
const nowReal=()=>Date.now();
const fmt2=n=>String(n).padStart(2,'0');
const fmtDuration=(ms,short=false)=>{
  ms=Math.max(0,ms); const total=Math.floor(ms/1000); const h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
  return short?`${h}h ${fmt2(m)}m`:`${fmt2(h)}:${fmt2(m)}:${fmt2(s)}`;
};
const fmtClock=ts=>new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const fmtDate=ts=>new Date(ts).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'});
const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const hashString=s=>{let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)} return h>>>0};
function rng(seed){let x=seed||123456789;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%100000)/100000}}

const RATIO_OPTIONS=[
  {fast:14,eat:10,label:'14:10',name:'Coastal',desc:'A gentle coastal rhythm.'},
  {fast:16,eat:8,label:'16:8',name:'Archipelago',desc:'A classic island crossing.'},
  {fast:18,eat:6,label:'18:6',name:'Open Sea',desc:'A long crossing with a compact harbour stay.'}
];
const BOAT_TYPES=[
  {id:'cutter',name:'Little Cutter',need:()=>true,desc:'Responsive and cheerful. A good all-rounder.',bias:'reef'},
  {id:'fishing',name:'Fishing Boat',need:()=>state.islands.filter(i=>i.known).length>=3,desc:'A working boat that tends to find wildlife.',bias:'wildlife'},
  {id:'shallow',name:'Shallow-Draft Skiff',need:()=>state.islands.filter(i=>i.known).length>=5,desc:'Made for reefs, coves and narrow channels.',bias:'reef'},
  {id:'cabin',name:'Cabin Cruiser',need:()=>getIsland('home').features.some(f=>['market','new_resident','guesthouse'].includes(f)),desc:'Cosy, sociable and good for story-led crossings.',bias:'signal'},
  {id:'sailer',name:'Traditional Sailer',need:()=>state.islands.filter(i=>i.known).length>=8,desc:'A beautiful rig for players who enjoy trimming the wind.',bias:'wind'}
];

const ISLAND_NAMES_A=['Mosswick','Sunberry','Gullhaven','Bramble','Fern','Driftwood','Wren','Moonstone','Pebble','Juniper','Tansy','Saltmere','Willow','Starling','Reedwater','Kelp','Honeycomb','Cloudberry','Oyster','Plover'];
const ISLAND_NAMES_B=['Island','Cove','Bay','Reach','Haven','Key','Point','Isle','Harbour','Shoal'];
const BIOMES=['meadow','pine','marsh','cliff','orchard','dune'];
const DISCOVERIES=[
  {kind:'bottle',icon:'✉',name:'Sealed bottle',desc:'A salt-clouded bottle with a careful wax seal.'},
  {kind:'timber',icon:'▰',name:'Driftwood beam',desc:'A sound old beam, worn smooth by the sea.'},
  {kind:'seeds',icon:'✿',name:'Strange seeds',desc:'Tiny blue-green seeds wrapped in sailcloth.'},
  {kind:'chart',icon:'⌁',name:'Damaged chart',desc:'A torn chart showing coastlines you do not recognise.'},
  {kind:'traveller',icon:'☻',name:'Lost traveller',desc:'A cheerful traveller whose ferry never arrived.'},
  {kind:'crate',icon:'▣',name:'Weathered crate',desc:'Marked with the crest of an old island guild.'},
  {kind:'glass',icon:'◆',name:'Sea glass',desc:'A handful of beautifully polished sea glass.'},
  {kind:'bell',icon:'♢',name:'Old harbour bell',desc:'Small, brass and still surprisingly clear-toned.'}
];

const MINIGAME_META={
  reef:{title:'REEF RUN',icon:'◇',desc:'Thread through shoals and scoop up drifting bottles.'},
  signal:{title:'LANTERN CODE',icon:'✦',desc:'Read a lighthouse pattern and signal it back.'},
  wind:{title:'SAIL TRIM',icon:'≈',desc:'Hold the sail in the sweet spot as the breeze shifts.'},
  wildlife:{title:'WILDLIFE WATCH',icon:'⌁',desc:'Spot dolphins and seabirds as they surface.'},
  soundings:{title:'DEEP SOUNDINGS',icon:'◎',desc:'Ping the seabed and home in on a hidden wreck.'},
  repair:{title:'DECK PATCH',icon:'✚',desc:'Patch little leaks before the next wave rolls through.'}
};
const VOYAGE_EVENT_TYPES=[
  {type:'dolphins',icon:'⌁',title:'Dolphins off the bow',log:'A pod of dolphins kept pace with the boat for a while.',ambient:true},
  {type:'seabirds',icon:'⌃',title:'A wheel of terns',log:'Terns circled a bright patch of water, then vanished toward the east.',ambient:true},
  {type:'trader',icon:'◁',title:'Red sail on the horizon',log:'A little red-sailed trader crossed the route and dipped its flag.',ambient:true},
  {type:'squall',icon:'☂',title:'Rain on the water',log:'A soft squall swept over the deck and left the sea shining.',ambient:true},
  {type:'bottle',icon:'✉',title:'Something in the wake',log:'A sealed bottle bobbed into view.',minigame:'reef',rewardKind:'bottle'},
  {type:'signal',icon:'✦',title:'A distant lantern',log:'A tiny lantern flashed a careful pattern from far off the route.',minigame:'signal',rewardKind:'chart'},
  {type:'shoal',icon:'◎',title:'A mark beneath the keel',log:'The sounder picked up an odd shape beneath the boat.',minigame:'soundings',rewardKind:'crate'},
  {type:'rigging',icon:'✚',title:'A loose line on deck',log:'A gust rattled the rigging and loosened a few fittings.',minigame:'repair',rewardKind:'timber'},
  {type:'breeze',icon:'≈',title:'The wind turns kindly',log:'A clean breeze arrived from the west.',minigame:'wind',rewardKind:'glass'},
  {type:'wildlife',icon:'☼',title:'Life in the blue',log:'Dark shapes surfaced beyond the starboard rail.',minigame:'wildlife',rewardKind:'seeds'}
];


function starterIsland(){return {id:'home',name:'Home Harbour',x:0,y:0,biome:'meadow',visits:1,known:true,home:true,features:['dock','cottage'],story:0,notes:['Your little harbour.'],createdAt:nowReal()}}
function makeIsland(name,x,y,biome='meadow'){return {id:uid('isl'),name,x,y,biome,visits:0,known:true,home:false,features:['jetty'],story:0,notes:[],createdAt:nowReal()}}

function defaultState(){
  const home=starterIsland();
  const moss=makeIsland('Mosswick Island',2,-1,'meadow'); moss.features.push('windmill_ruin');
  return {
    version:VERSION, createdAt:nowReal(), onboarded:false, playerName:'Captain', sound:true, reducedMotion:false,
    phase:'ashore', phaseStartedAt:nowReal(), selectedRatio:16, voyage:null, activeView:'harbour',
    islands:[home,moss], routes:[['home',moss.id]], sessions:[], currentIslandId:'home', pendingResolutions:[],
    totalMinigames:0, worldSeed:Math.floor(Math.random()*1e9), selectedDestinationId:moss.id,
    journal:['You inherited a little harbour, an old sailing boat, and a chart with more blank water than ink.'],
    boat:{type:'cutter',name:'Mackerel',features:['small cabin']}, settings:{prototypeTools:false},
    sim:{active:false,offsetMs:0}, achievements:{}, lastSavedAt:nowReal()
  }
}

let state=loadState();
function loadState(){
  try{const raw=localStorage.getItem(SAVE_KEY); if(raw){const s=JSON.parse(raw); return migrate(s)}}catch(e){console.warn('Save load failed',e)}
  return defaultState();
}
function migrate(s){
  const d=defaultState(); s={...d,...s}; s.settings={...d.settings,...(s.settings||{})}; s.sim={...d.sim,...(s.sim||{})}; s.boat={...d.boat,...(s.boat||{})};
  if(!Array.isArray(s.islands)||!s.islands.length)s.islands=d.islands;
  if(!Array.isArray(s.sessions))s.sessions=[]; if(!Array.isArray(s.routes))s.routes=[]; if(!Array.isArray(s.journal))s.journal=[];

let storageWarned=false;
function save(){state.lastSavedAt=nowReal();try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){if(!storageWarned){storageWarned=true;console.warn('MakeFast could not access browser storage in this context.',e)}}}
function gameNow(){return nowReal()+(state.sim?.active?state.sim.offsetMs:0)}

const canvas=$('#game'), ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
let DPR=1, frame=0, lastTs=0, toastTimer=null, minigame=null, particles=[], sceneEvent=null, lastVoyageEventCheck=0;
const pointer={x:0,y:0,down:false};

function toast(msg){const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function beep(type='bell'){
  if(!state.sound)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; const ac=new AC(); const t=ac.currentTime;
    const tones=type==='bell'?[523.25,659.25,783.99]:type==='find'?[659.25,880]:[392,523.25];
    tones.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(); o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.04,t+i*.08);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.18);o.connect(g);g.connect(ac.destination);o.start(t+i*.08);o.stop(t+i*.08+.2)});
    setTimeout(()=>ac.close(),600)
  }catch(e){}
}

function currentRatio(){return RATIO_OPTIONS.find(r=>r.fast===state.selectedRatio)||RATIO_OPTIONS[1]}
function getIsland(id){return state.islands.find(i=>i.id===id)||state.islands[0]}
function currentIsland(){return getIsland(state.currentIslandId)}
function voyageProgress(){
  if(!state.voyage)return 0; const p=(gameNow()-state.voyage.startedAt)/(state.voyage.targetMs); return clamp(p,0,1);
}
function actualFastMs(){return state.voyage?Math.max(0,gameNow()-state.voyage.startedAt):0}
function shoreElapsed(){return Math.max(0,gameNow()-state.phaseStartedAt)}
function selectedDest(){return state.selectedDestinationId==='uncharted'?null:getIsland(state.selectedDestinationId)}

function totalFastMs(){
  let total=state.sessions.filter(s=>!s.simulated).reduce((a,s)=>a+(s.durationMs||0),0);
  if((state.phase==='fasting'||state.phase==='arrived')&&state.voyage&&!state.voyage.simulated) total+=actualFastMs();
  return total;
}
function totalShoreMs(){return Math.max(0,(nowReal()-state.createdAt)-totalFastMs())}
function rollingStats(days=30){
  const from=nowReal()-days*86400000; const sessions=state.sessions.filter(s=>!s.simulated&&s.endedAt>=from);
  if(!sessions.length)return {avgFast:0,avgEat:0,count:0};
  const avgFast=sessions.reduce((a,s)=>a+s.durationMs,0)/sessions.length;
  const intervals=[]; for(let i=1;i<sessions.length;i++){const d=sessions[i].startedAt-sessions[i-1].endedAt;if(d>0&&d<36*3600000)intervals.push(d)}
  const avgEat=intervals.length?intervals.reduce((a,b)=>a+b,0)/intervals.length:Math.max(0,86400000-avgFast);

}

function setView(view){
  if(minigame){toast('Finish or leave the minigame first.');return}
  state.activeView=view; save(); renderUI();
}

function ensureArrived(){

    state.phase='arrived';
    if(Array.isArray(state.voyage.events)){state.voyage.events.filter(e=>e.triggered&&!e.resolved).forEach(e=>{e.resolved=true});state.voyage.activeEventId=null;}
    if(!state.voyage.landSightedAt){state.voyage.landSightedAt=gameNow(); state.journal.unshift(`Land sighted on the voyage toward ${state.voyage.destinationName}.`); beep('bell'); toast('Land sighted. Dock whenever you are ready.');}
    save(); renderUI();
  }
}

function buildVoyageEvents(voyageId){
  const rr=rng(hashString(String(voyageId)+'makefast-events'));
  const slots=[.08,.21,.36,.52,.68,.84];
  const pool=[...VOYAGE_EVENT_TYPES]; const events=[];
  slots.forEach((p,idx)=>{let pick=Math.floor(rr()*pool.length);const base=pool.splice(pick,1)[0]||VOYAGE_EVENT_TYPES[Math.floor(rr()*VOYAGE_EVENT_TYPES.length)];events.push({...base,id:uid('evt'),p,triggered:false,resolved:false});});
  return events;
}
function activeVoyageEvent(){
  if(!state.voyage?.events)return null; return state.voyage.events.find(e=>e.triggered&&!e.resolved&&!e.ambient)||null;
}
function voyageEventById(id){return state.voyage?.events?.find(e=>e.id===id)||null}
function processVoyageEvents(){
  if(!state.voyage||state.phase!=='fasting'||minigame)return;
  const t=performance.now(); if(t-lastVoyageEventCheck<700)return; lastVoyageEventCheck=t;
  if(!Array.isArray(state.voyage.events)||!state.voyage.events.length)state.voyage.events=buildVoyageEvents(state.voyage.id);
  if(!Array.isArray(state.voyage.seaLog))state.voyage.seaLog=[];
  const p=voyageProgress(); let changed=false;
  for(const e of state.voyage.events){
    if(!e.triggered&&p>=e.p){
      e.triggered=true; changed=true; state.voyage.seaLog.unshift({at:gameNow(),icon:e.icon,title:e.title,text:e.log});
      sceneEvent={...e,started:performance.now(),duration:e.ambient?11000:18000}; toast(e.title);
      if(e.ambient)e.resolved=true;
      if(!state.voyage.activeEventId&&!e.ambient)state.voyage.activeEventId=e.id;
    }
  }
  if(changed){save();renderUI()}
}
function investigateVoyageEvent(id){
  const e=voyageEventById(id); if(!e||e.resolved||state.phase!=='fasting')return; state.voyage.activeEventId=e.id; startMinigame(e.minigame||'reef',75,{eventId:e.id,rewardKind:e.rewardKind});
}
function letVoyageEventPass(id){
  const e=voyageEventById(id); if(!e)return; e.resolved=true; if(state.voyage.activeEventId===id)state.voyage.activeEventId=null; if(sceneEvent?.id===id)sceneEvent=null; state.voyage.seaLog.unshift({at:gameNow(),icon:'≈',title:'Back on course',text:`${e.title} slipped astern as the voyage carried on.`}); save();renderUI();toast('The sea settles again.');
}
function resolveEncounterEvent(id,score){
  const e=voyageEventById(id); if(!e)return; e.resolved=true; if(state.voyage.activeEventId===id)state.voyage.activeEventId=null; if(sceneEvent?.id===id)sceneEvent=null; const note=score>0?`${e.title} became a small story for the log.`:`${e.title} passed into the wake.`; state.voyage.seaLog.unshift({at:gameNow(),icon:e.icon,title:e.title,text:note});
}

function startVoyage(){
  if(state.phase!=='ashore')return;
  const r=currentRatio(); let dest;
  if(state.selectedDestinationId==='uncharted'){
    dest=generateUnchartedIsland(); dest.known=false; state.islands.push(dest); state.routes.push([state.currentIslandId,dest.id]);
  } else {
    dest=selectedDest();
    if(!dest||dest.id===state.currentIslandId) dest=state.islands.find(i=>i.known&&i.id!==state.currentIslandId)||state.islands[0];
  }

  state.voyage={
    id:voyageId, startedAt:gameNow(), startedAtReal:nowReal(), targetMs:r.fast*3600000, targetHours:r.fast, eatingHours:r.eat,
    originId:state.currentIslandId, originName:currentIsland().name, destinationId:dest.id, destinationName:dest.name,
    discoveryIds:[], discoveries:[], minigamesPlayed:0, plannedProgress:0, simulated:!!state.sim.active, uncharted:!dest.known,
    events:buildVoyageEvents(voyageId), seaLog:[{at:gameNow(),icon:'⚑',title:'Under way',text:`${currentIsland().name} slipped astern and the bow turned toward ${dest.known?dest.name:'open water'}.`}],activeEventId:null

function earlyDockPrompt(){

  `);

function dock(early=false){
  if(!state.voyage)return;
  const v=state.voyage; const ended=gameNow(); const duration=ended-v.startedAt; const progress=clamp(duration/v.targetMs,0,1);
  let dest=getIsland(v.destinationId);
  if(early&&progress<.995){
    const cove=generateCove(progress,v); state.islands.push(cove); state.routes.push([v.originId,cove.id]); dest=cove;
    state.journal.unshift(`Plans changed: put into ${cove.name} after ${fmtDuration(duration,true)} at sea.`);
  }else{
    if(!dest.known){dest.known=true; state.journal.unshift(`Discovered ${dest.name}.`)}
    state.journal.unshift(`Docked at ${dest.name} after ${fmtDuration(duration,true)} at sea.`);
  }
  dest.visits=(dest.visits||0)+1; state.currentIslandId=dest.id;
  const session={id:v.id,startedAt:v.startedAtReal||v.startedAt,endedAt:nowReal(),durationMs:state.sim.active?duration:Math.max(0,nowReal()-(v.startedAtReal||nowReal())),targetHours:v.targetHours,completed:progress>=.995,progress,destinationId:dest.id,simulated:!!v.simulated};
  state.sessions.push(session);

  sceneEvent=null; state.voyage=null; state.phase='ashore'; state.phaseStartedAt=gameNow(); state.activeView='harbour';
  const nextHome=getIsland('home');
  const nextOther=state.islands.find(i=>i.known&&i.id!==dest.id);
  state.selectedDestinationId=dest.id!=='home'?nextHome.id:(nextOther?.id||'uncharted');
  if(state.sim.active){state.sim.active=false;state.sim.offsetMs=0;toast('Sea trial complete.')}
  save(); beep('bell'); renderUI();
  if(state.pendingResolutions.length) setTimeout(()=>openResolution(),250);
  else setTimeout(()=>openArrivalProject(dest),250);
}

function generateUnchartedIsland(){
  const rr=rng(state.worldSeed+state.islands.length*7919+Date.now()%99991); const origin=currentIsland();
  const ang=rr()*Math.PI*2, dist=2.1+rr()*1.7; let x=Math.round((origin.x+Math.cos(ang)*dist)*10)/10, y=Math.round((origin.y+Math.sin(ang)*dist)*10)/10;
  for(let tries=0;tries<6;tries++){if(!state.islands.some(i=>Math.hypot(i.x-x,i.y-y)<1.2))break;x+=.8;y+=.4}
  const name=ISLAND_NAMES_A[Math.floor(rr()*ISLAND_NAMES_A.length)]+' '+ISLAND_NAMES_B[Math.floor(rr()*ISLAND_NAMES_B.length)];
  return makeIsland(name,x,y,BIOMES[Math.floor(rr()*BIOMES.length)]);
}
function generateCove(progress,v){
  const a=getIsland(v.originId), b=getIsland(v.destinationId); const t=clamp(progress,.18,.88); const rr=rng(hashString(v.id+'cove'));
  const x=lerp(a.x,b.x,t)+(rr()-.5)*.5, y=lerp(a.y,b.y,t)+(rr()-.5)*.5;
  let name=ISLAND_NAMES_A[Math.floor(rr()*ISLAND_NAMES_A.length)]+' Cove';
  if(state.islands.some(i=>i.name===name))name='Little '+name;
  const c=makeIsland(name,x,y,BIOMES[Math.floor(rr()*BIOMES.length)]); c.features=['tiny_jetty']; c.notes.push('First entered on a change of tide.'); return c;
}

function addDiscovery(kind=null){

  const base=kind?DISCOVERIES.find(d=>d.kind===kind):pool[Math.floor(Math.random()*pool.length)]; if(!base)return;
  const d={...base,id:uid('find')}; state.voyage.discoveries.push(d); save(); beep('find'); toast(`${d.name} brought aboard.`); renderUI();
}

function openResolution(){

function resolutionChoices(d,dest,home){

  const revealRoute=()=>{const n=generateUnchartedIsland();n.known=true;state.islands.push(n);state.routes.push([dest.id,n.id]);state.journal.unshift(`The restored chart revealed a route to ${n.name}.`)};

function islandProjects(dest,visit){

function startRandomMinigame(seconds=75){
  if(state.phase!=='fasting'||!state.voyage)return;
  const types=Object.keys(MINIGAME_META), boat=BOAT_TYPES.find(b=>b.id===state.boat.type)||BOAT_TYPES[0];
  let type=types[(state.totalMinigames+state.voyage.minigamesPlayed)%types.length];
  if(Math.random()<.38&&types.includes(boat.bias))type=boat.bias;
  const actual=state.sim?.active?Math.min(seconds,30):seconds; startMinigame(type,actual);
}
function startMinigame(type,seconds,opts={}){
  if(!state.voyage)return; state.totalMinigames++; state.voyage.minigamesPlayed++; save();
  const meta=MINIGAME_META[type]||MINIGAME_META.reef,common={type,duration:seconds*1000,started:performance.now(),score:0,done:false,title:meta.title,eventId:opts.eventId||null,rewardKind:opts.rewardKind||null};
  if(type==='reef')minigame={...common,boatX:320,boatY:280,rocks:[],drops:[],spawn:0,bumpUntil:0};
  if(type==='signal')minigame={...common,seq:[],input:[],round:0,flashIndex:-1,phase:'show',nextAt:performance.now()+700};
  if(type==='wind')minigame={...common,angle:.5,target:.2+Math.random()*.6,hold:0,nextShift:performance.now()+4200};
  if(type==='wildlife')minigame={...common,animals:[],spawn:0};
  if(type==='soundings')minigame={...common,target:{x:Math.floor(Math.random()*6),y:Math.floor(Math.random()*4)},pings:[],lastHint:'Tap the chart to take a sounding.'};

}
function endMinigame(reason='done'){
  if(!minigame)return; const g=minigame,score=g.score, success=score>0;
  if(reason!=='leave'&&g.eventId&&state.voyage)resolveEncounterEvent(g.eventId,score);
  if(reason!=='leave'&&success&&state.voyage&&state.voyage.discoveries.length<5){
    const threshold=g.type==='signal'?1:g.type==='soundings'?1:2;
    if(score>=threshold){const desired=g.rewardKind||null; const chance=g.eventId?.length?1:Math.min(.72,.22+score*.055); if(Math.random()<chance)addDiscovery(desired)}
  }

  toast(success?`A good little spell at the helm — ${score}.`:'The boat settles back onto her course.');
  if(reason!=='leave'&&state.phase==='fasting'&&state.voyage){setTimeout(()=>{
    showModal(`<h2>Back on course</h2><p>The sea is quiet again.</p><div class="choice" id="feelFine"><b>Let her sail</b><span>Return to the voyage.</span></div><div class="choice" id="feelAgain"><b>Another diversion</b><span>Take the helm for another short encounter.</span></div><div class="choice" id="feelEat"><b>Make for harbour</b><span>Bring the boat in and begin the eating window.</span></div>`,false);
    $('#feelFine').onclick=closeModal; $('#feelAgain').onclick=()=>{closeModal();startRandomMinigame(75)}; $('#feelEat').onclick=()=>{closeModal();earlyDockPrompt()};
  },180)}
}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*canvas.width;pointer.y=(e.clientY-r.top)/r.height*canvas.height;pointer.down=true;if(minigame)minigamePointer('down',pointer.x,pointer.y)});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*canvas.width;pointer.y=(e.clientY-r.top)/r.height*canvas.height;if(minigame)minigamePointer('move',pointer.x,pointer.y)});

function minigamePointer(type,x,y){
  if(!minigame)return;
  if(minigame.type==='reef'&&type==='move'&&pointer.down)minigame.boatX=clamp(x,35,605);
  if(minigame.type==='signal'&&type==='down'){const centers=[[240,150],[400,150],[240,250],[400,250]];centers.forEach((c,i)=>{if(Math.hypot(x-c[0],y-c[1])<45)signalInput(i)})}

  if(minigame.type==='wildlife'&&type==='down'){for(let i=minigame.animals.length-1;i>=0;i--){const a=minigame.animals[i];if(Math.hypot(x-a.x,y-a.y)<28){minigame.animals.splice(i,1);minigame.score++;beep('soft');break}}}
  if(minigame.type==='soundings'&&type==='down')soundingTap(x,y);
  if(minigame.type==='repair'&&type==='down'){for(let i=minigame.leaks.length-1;i>=0;i--){const a=minigame.leaks[i];if(Math.hypot(x-a.x,y-a.y)<24){minigame.leaks.splice(i,1);minigame.score++;beep('soft');break}}}
}

}
function renderSoundings(g,ts){
  rect(0,0,640,360,'#214f67');roundedRect(96,58,448,260,8,'#f5e8c7','#18313a',3);const left=128,top=88,cw=64,ch=58;for(let y=0;y<4;y++)for(let x=0;x<6;x++){rect(left+x*cw,top+y*ch,cw-2,ch-2,(x+y)%2?'#d8e3c5':'#e7edd0');pxText(`${x+1}${String.fromCharCode(65+y)}`,left+x*cw+6,top+y*ch+14,'#6e795e',7)}
  g.pings.forEach(p=>{const cx=left+p.gx*cw+cw/2,cy=top+p.gy*ch+ch/2;circle(cx,cy,6,p.d<1.5?'#df7c68':p.d<2.7?'#e5b54e':'#65bdd1','#18313a',1)});pxText('DEEP SOUNDINGS',22,28,'#fff7de',12);pxText(g.lastHint,320,338,'#fff7de',8,'center');
}
function renderRepair(g,ts){
  drawSeaBackground();roundedRect(115,70,410,235,12,'#b98359','#18313a',4);for(let x=130;x<510;x+=34)rect(x,78,3,215,'rgba(88,52,34,.2)');
  if(ts-g.spawn>950&&g.leaks.length<7){g.spawn=ts;g.leaks.push({x:150+Math.random()*340,y:105+Math.random()*160,born:ts})}if(ts>g.waveAt){g.waveAt=ts+5000;g.leaks.forEach(l=>l.born-=900);}
  g.leaks=g.leaks.filter(l=>ts-l.born<5000);g.leaks.forEach(l=>{const age=(ts-l.born)/5000;circle(l.x,l.y,9,'#65bdd1','#18313a',2);circle(l.x,l.y,3,'#dff5f4');if(age>.7)drawSparkle(l.x+10,l.y-8,'#dff5f4')});pxText('DECK PATCH',22,28,'#fff7de',12);pxText('TAP THE LEAKS BEFORE THE NEXT WAVE',320,340,'#fff7de',8,'center');
}
function drawVoyageSceneEvent(e,ts,bx,by){
  if(!e)return;const age=ts-(e.started||ts),t=clamp(age/(e.duration||12000),0,1);if(t>=1&&e.ambient){sceneEvent=null;return}
  const type=e.type;
  if(type==='dolphins'||type==='wildlife'){for(let i=0;i<4;i++){const x=bx+80+i*26-(t*150),y=by-30+Math.sin(t*12+i)*14;poly([[x-10,y],[x+3,y-2],[x+9,y+1],[x+2,y+4],[x-7,y+3]],'#2f6f85','#173a4a',1)}}
  if(type==='seabirds'){for(let i=0;i<6;i++){const x=40+t*560+i*16,y=70+i%3*10;line(x-5,y,x,y-3,'#fff7de',2);line(x,y-3,x+5,y,'#fff7de',2)}}
  if(type==='trader'){drawTopBoat(610-t*700,110,1,-.5,'sailer')}
  if(type==='squall'){const x=640-t*760;rect(x,0,180,360,'rgba(38,71,83,.28)');for(let i=0;i<20;i++)rect(x+10+(i*31)%170,40+(i*47)%280,1,8,'rgba(240,252,255,.48)')}
  if(type==='bottle'){roundedRect(bx+70,by-42,10,15,2,'#e5b54e','#704630',2);drawSparkle(bx+83,by-48,'#fff7de')}
  if(type==='signal'){const pulse=(Math.sin(ts*.008)>0)?1:0;circle(560,68,5,pulse?'#fff7de':'#df7c68');if(pulse)circle(560,68,14,'rgba(255,247,222,.12)')}
  if(type==='shoal'){for(let i=0;i<8;i++){const x=bx+80+(i%4)*16,y=by+60+Math.floor(i/4)*13;rect(x,y,9,3,'rgba(32,91,112,.65)')}}
  if(type==='rigging'){for(let i=0;i<4;i++){const x=bx-22+i*14,y=by-30+Math.sin(ts*.02+i)*6;rect(x,y,10,2,'#fff7de')}}
  if(type==='breeze'){for(let i=0;i<6;i++){const x=((i*120+ts*.08)%760)-60;rect(x,60+i*35,42,2,'rgba(255,255,255,.45)')}}
}

function animationLoop(ts){lastTs=ts;ensureArrived();processVoyageEvents();updateHeader();renderScene(ts);requestAnimationFrame(animationLoop)}

// UI events
$$('.navbtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#soundBtn').onclick=()=>{state.sound=!state.sound;save();renderUI()};
window.addEventListener('beforeunload',save);
setInterval(()=>{save();renderUI()},60000);
setInterval(()=>{if(state.sim?.active&&state.phase!=='ashore'){/* preview uses real time */}},1000);

// Start
renderUI();requestAnimationFrame(animationLoop);if(!state.onboarded)setTimeout(onboarding,120);

})();
</script>
