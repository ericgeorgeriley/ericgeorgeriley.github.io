<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MakeFast — Living Archipelago</title>
<style>
  :root{

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#173a4a;color:var(--ink);font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;overflow:hidden}
  button,input,select,textarea{font:inherit}

  .topbar{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--paper);border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--shadow);z-index:10;min-height:70px}
  .brand{display:flex;align-items:center;gap:10px;min-width:190px}
  .brandmark{width:43px;height:43px;position:relative;background:var(--sea);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--wood-dark);overflow:hidden}

  .brandmark:after{content:"";position:absolute;left:19px;top:6px;width:3px;height:19px;background:var(--ink);box-shadow:7px 6px 0 -1px var(--cream)}
  .brand h1{font-size:18px;line-height:1;margin:0;letter-spacing:-1px}.brand small{display:block;color:var(--ink-soft);font-size:9px;margin-top:4px}
  .phase-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);min-width:145px}
  .phase-dot{width:11px;height:11px;border:2px solid var(--ink);background:var(--grass);box-shadow:2px 2px 0 var(--shadow)}
  .phase-chip.sea .phase-dot{background:var(--sea)}
  .phase-chip.arrived .phase-dot{background:var(--gold)}
  .phase-chip b{display:block;font-size:11px}.phase-chip span{display:block;font-size:9px;color:var(--ink-soft);margin-top:2px}
  .timerbox{margin-left:auto;text-align:right;min-width:185px}.timerbox .timer{font-weight:900;font-size:23px;letter-spacing:-1px}.timerbox .sub{font-size:9px;color:var(--ink-soft);margin-top:2px}
  .tiny-btn{border:3px solid var(--ink);background:var(--cream);color:var(--ink);padding:8px 10px;border-radius:7px;box-shadow:3px 3px 0 var(--shadow);font-weight:800;font-size:10px;cursor:pointer}.tiny-btn:hover{transform:translateY(-1px)}.tiny-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}.quick-action{min-width:92px;background:var(--grass);white-space:nowrap}.quick-action.eat{background:var(--gold)}.quick-action.at-sea{background:#d9eef2}.quick-action:focus-visible{outline:3px solid #fff;outline-offset:2px}

  .main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px;background:linear-gradient(#bfe9e4,#89cfda)}
  .stage-wrap{min-width:0;min-height:0;position:relative;background:#1c657c;border:4px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(22,49,58,.22);overflow:hidden}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
  #game{z-index:1}
  .stage-label,.map-controls,.game-hud,.toast,.voyage-status{z-index:3}
  .stage-label{position:absolute;top:10px;left:10px;background:rgba(255,247,222,.94);border:3px solid var(--ink);padding:6px 8px;border-radius:6px;box-shadow:3px 3px 0 rgba(22,49,58,.18);font-size:10px;pointer-events:none}
  .stage-label b{font-size:11px}
  .voyage-status{position:absolute;top:10px;right:10px;display:none;max-width:min(45%,230px);background:rgba(255,247,222,.94);border:3px solid var(--ink);padding:6px 8px;border-radius:7px;box-shadow:3px 3px 0 rgba(22,49,58,.18);pointer-events:none}.voyage-status.show{display:block}.voyage-status b{display:block;font-size:10px;line-height:1.2;white-space:normal}.voyage-status span{display:block;font-size:8px;line-height:1.35;color:var(--ink-soft);margin-top:2px;white-space:normal}
  .voyage-encounter{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(16px);display:none;width:min(520px,calc(100% - 24px));background:rgba(255,247,222,.97);border:3px solid var(--ink);border-radius:9px;box-shadow:4px 4px 0 rgba(22,49,58,.2);padding:8px 9px;z-index:7}.voyage-encounter.show{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;transform:translateX(-50%) translateY(0)}.voyage-encounter .enc-copy b{display:block;font-size:10px}.voyage-encounter .enc-copy span{display:block;font-size:8px;color:var(--ink-soft);line-height:1.35;margin-top:2px}.voyage-encounter .enc-actions{display:flex;gap:5px}.voyage-encounter button{border:2px solid var(--ink);border-radius:6px;background:var(--sea);padding:7px 8px;font-weight:900;font-size:8px;cursor:pointer}.voyage-encounter button.ghost{background:var(--cream)}
  .voyage-peek{position:absolute;left:7px;right:7px;bottom:56px;display:none;z-index:14;background:rgba(45,126,154,.96);border:3px solid var(--ink);border-radius:9px;padding:7px 9px;box-shadow:3px 3px 0 rgba(22,49,58,.2);color:#fff;cursor:pointer}.voyage-peek.show{display:block}.voyage-peek .peek-row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:8px;font-weight:900}.voyage-peek .peek-row span:last-child{opacity:.86;font-weight:700}.voyage-peek .peek-meter{height:10px;margin-top:5px;background:rgba(255,255,255,.24);border:2px solid var(--ink);border-radius:5px;overflow:hidden}.voyage-peek .peek-meter i{display:block;height:100%;width:0;background:#b9edf3;transition:width .3s}.voyage-note{position:absolute;left:10px;right:10px;bottom:112px;display:none;z-index:16;background:rgba(45,126,154,.97);border:3px solid var(--ink);border-radius:10px;padding:9px 11px;color:#fff;box-shadow:4px 4px 0 rgba(22,49,58,.22);cursor:pointer;transform:translateY(12px);opacity:0;transition:.2s}.voyage-note.show{display:block;transform:translateY(0);opacity:1}.voyage-note b{display:block;font-size:10px}.voyage-note span{display:block;font-size:8px;line-height:1.35;opacity:.9;margin-top:2px}.cargo-board{display:grid;gap:6px}.cargo-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;border:2px solid var(--ink);background:#fff;border-radius:7px;padding:7px}.cargo-row b{font-size:9px;display:block}.cargo-row small{font-size:7px;color:var(--ink-soft)}.cargo-actions{display:flex;gap:4px}.cargo-actions button{border:2px solid var(--ink);background:var(--cream);border-radius:5px;padding:5px 6px;font-size:7px;font-weight:900;cursor:pointer}.cargo-actions button.load{background:#d8eef3}.cargo-actions button:disabled{opacity:.35;cursor:not-allowed}.hold-meter{height:12px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;margin-top:6px}.hold-meter i{display:block;height:100%;background:var(--sea);width:0}.fleet-card{border:2px solid var(--ink);background:#fff;border-radius:7px;padding:7px;margin-bottom:6px}.fleet-card b{font-size:9px;display:block}.fleet-card span{font-size:7px;color:var(--ink-soft);line-height:1.35;display:block;margin-top:2px}
  @media (max-width:520px){.voyage-encounter{bottom:10px;grid-template-columns:1fr}.voyage-encounter .enc-actions{display:grid;grid-template-columns:1fr 1fr}.voyage-encounter button{padding:7px 5px}}
  .toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--paper);border:3px solid var(--ink);border-radius:7px;box-shadow:4px 4px 0 rgba(22,49,58,.2);padding:9px 12px;font-size:10px;transition:.22s;pointer-events:none;max-width:70%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .panel{min-height:0;background:var(--paper);border:4px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 rgba(22,49,58,.22);display:flex;flex-direction:column;overflow:hidden}
  .panel-head{padding:12px 13px 9px;border-bottom:3px solid var(--ink);background:#fff4c8}.panel-head h2{font-size:13px;margin:0 0 4px}.panel-head p{font-size:9px;color:var(--ink-soft);margin:0;line-height:1.45}
  .panel-body{padding:12px;overflow:auto;min-height:0;scrollbar-width:thin;flex:1}
  .section{margin-bottom:14px}.section:last-child{margin-bottom:0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;color:var(--ink-soft)}
  .card{background:var(--cream);border:3px solid var(--ink);border-radius:8px;padding:10px;box-shadow:3px 3px 0 var(--shadow);margin-bottom:8px}.card.selected{background:#e2f2d2;outline:3px solid rgba(255,255,255,.8);outline-offset:-7px}.card h3{font-size:11px;margin:0 0 5px}.card p{font-size:9px;line-height:1.45;margin:0;color:var(--ink-soft)}
  .row{display:flex;gap:7px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
  .big-btn{width:100%;border:3px solid var(--ink);background:var(--grass);color:#112d34;padding:11px 12px;border-radius:8px;box-shadow:4px 4px 0 var(--wood-dark);font-weight:1000;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.4px}.big-btn.secondary{background:var(--sea)}.big-btn.warm{background:var(--gold)}.big-btn.danger{background:#efb5a9}.big-btn.ghost{background:var(--cream);box-shadow:3px 3px 0 var(--shadow)}.big-btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}.big-btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--wood-dark)}
  .ratio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ratio{border:3px solid var(--ink);background:#fff;padding:8px 5px;border-radius:7px;text-align:center;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.ratio.active{background:#dff1cf;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}.ratio b{font-size:11px;display:block}.ratio span{font-size:8px;color:var(--ink-soft);display:block;margin-top:2px}
  .meter{height:18px;border:3px solid var(--ink);background:#fff;border-radius:6px;overflow:hidden;position:relative}.meter-fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sea) 0,var(--sea) 12px,#8ed4df 12px,#8ed4df 16px);transition:width .4s}.meter-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;text-shadow:1px 1px #fff}
  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini{border:3px solid var(--ink);background:#fff;padding:8px 5px;border-radius:7px;text-align:center;cursor:pointer;font-size:9px;box-shadow:2px 2px 0 var(--shadow)}.mini:hover{background:#e9f7f5}
  .find{display:flex;gap:8px;align-items:flex-start;padding:8px;border:3px solid var(--ink);background:#fff;border-radius:7px;margin-bottom:6px}.find-icon{width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--ink);background:#e6d39b;font-size:16px;flex:0 0 auto}.find b{font-size:9px;display:block}.find small{font-size:8px;color:var(--ink-soft);line-height:1.35;display:block;margin-top:2px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:#fff;border:3px solid var(--ink);border-radius:7px;padding:8px}.stat b{font-size:14px;display:block}.stat span{font-size:8px;color:var(--ink-soft)}
  .session{display:grid;grid-template-columns:48px 1fr 52px;gap:7px;align-items:center;font-size:8px;border-bottom:2px dashed #d8cda8;padding:6px 0}.session:last-child{border-bottom:0}.session .bar{height:8px;border:2px solid var(--ink);background:#fff}.session .bar>i{display:block;height:100%;background:var(--sea)}
  .pill{display:inline-flex;align-items:center;border:2px solid var(--ink);background:#fff;padding:3px 5px;border-radius:999px;font-size:8px;margin:2px 3px 2px 0}
  .stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stock-item{border:2px solid var(--ink);background:#fff;padding:6px;border-radius:6px;font-size:8px}.stock-item b{display:block;font-size:11px}.stock-item span{color:var(--ink-soft)}
  .project-card{border:3px solid var(--ink);background:#fff;border-radius:8px;padding:9px;margin-bottom:8px;box-shadow:3px 3px 0 var(--shadow)}.project-card.done{background:#e7f2d9}.project-card h3{font-size:10px;margin:0 0 4px}.project-card p{font-size:8px;margin:0 0 6px;color:var(--ink-soft);line-height:1.4}
  .project-meter{height:10px;border:2px solid var(--ink);background:#fff;border-radius:4px;overflow:hidden;margin:5px 0}.project-meter i{display:block;height:100%;background:var(--grass);width:0}
  .materials{display:flex;flex-wrap:wrap;gap:4px}.material{display:inline-flex;gap:4px;align-items:center;border:2px solid var(--ink);background:var(--cream);padding:3px 5px;border-radius:5px;font-size:8px}.material.met{background:#dff1cf}.material button{border:0;background:var(--gold);font-weight:900;cursor:pointer;padding:1px 4px;margin-left:2px}
  .resident-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}.resident{display:flex;gap:7px;align-items:center;border:2px solid var(--ink);background:#fff;border-radius:6px;padding:6px;font-size:8px}.outfit-dot{width:17px;height:17px;border:2px solid var(--ink);border-radius:3px;flex:0 0 auto}
  .traffic-list{display:grid;gap:6px}.traffic{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--ink);background:#fff;border-radius:7px;padding:7px;font-size:8px}.traffic .vessel-icon{width:28px;height:22px;display:grid;place-items:center;background:#dff1cf;border:2px solid var(--ink);border-radius:4px;flex:0 0 auto}.traffic b{font-size:9px}.traffic span{color:var(--ink-soft);line-height:1.35;display:block;margin-top:2px}.world-log{border-left:3px solid #cbbd91;padding:3px 0 3px 8px;margin-bottom:6px;font-size:8px}.world-log b{display:block;font-size:9px}.world-log span{color:var(--ink-soft);line-height:1.35}
  .site-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.site-choice{border:3px solid var(--ink);background:#fff;border-radius:7px;padding:9px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.site-choice:hover{background:#edf7dc}.site-choice b{display:block;font-size:10px}.site-choice span{display:block;font-size:8px;color:var(--ink-soft);margin-top:3px}
  .muted{color:var(--ink-soft);font-size:8px;line-height:1.4}.divider{height:3px;background:var(--ink);opacity:.15;margin:10px 0}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:4px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom);z-index:11}.navbtn{border:0;border-right:2px solid #c9b98e;background:var(--paper);padding:8px 4px;cursor:pointer;color:var(--ink);font-weight:900;font-size:9px}.navbtn:last-child{border-right:0}.navbtn.active{background:#dff1cf;box-shadow:inset 0 4px 0 var(--grass-dark)}.navbtn span{display:block;font-size:15px;margin-bottom:2px}

  .modal-back{position:fixed;inset:0;background:rgba(14,36,45,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-back.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 rgba(0,0,0,.25);padding:16px}.modal h2{font-size:16px;margin:0 0 7px}.modal p{font-size:10px;line-height:1.5;color:var(--ink-soft)}.modal .notice{background:#fff0ce;border:3px solid var(--ink);padding:9px;border-radius:7px;font-size:9px;line-height:1.45;margin:10px 0}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}
  .choice{border:3px solid var(--ink);background:#fff;border-radius:7px;padding:9px;margin-top:7px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}.choice:hover{background:#edf7dc}.choice b{font-size:10px;display:block}.choice span{font-size:8px;color:var(--ink-soft);display:block;margin-top:3px;line-height:1.4}

  .game-hud{position:absolute;inset:10px 10px auto auto;background:rgba(255,247,222,.94);border:3px solid var(--ink);border-radius:7px;padding:7px 9px;font-size:9px;box-shadow:3px 3px 0 var(--shadow);display:none}.game-hud.show{display:block}
  .game-hud b{font-size:11px}.game-hud .gamebar{width:120px;height:10px;border:2px solid var(--ink);background:#fff;margin-top:4px}.game-hud .gamebar i{display:block;height:100%;background:var(--coral);width:100%}
  .event-card{background:#e8f5ed;border:3px solid var(--ink);border-radius:8px;padding:10px;box-shadow:3px 3px 0 var(--shadow);margin-bottom:8px;position:relative;overflow:hidden}.event-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sea)}.event-card h3{font-size:11px;margin:0 0 4px;padding-left:5px}.event-card p{font-size:9px;line-height:1.45;margin:0;padding-left:5px;color:var(--ink-soft)}
  .activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.activity{border:3px solid var(--ink);background:#fff;border-radius:8px;padding:9px;text-align:left;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}.activity:hover{background:#edf7dc;transform:translateY(-1px)}.activity b{display:block;font-size:9px}.activity span{display:block;font-size:8px;color:var(--ink-soft);line-height:1.3;margin-top:3px}
  .sea-log{display:flex;gap:7px;align-items:flex-start;border-bottom:2px dashed #d8cda8;padding:6px 0}.sea-log:last-child{border-bottom:0}.sea-log i{font-style:normal;font-size:14px;line-height:1}.sea-log span{font-size:8px;color:var(--ink-soft);line-height:1.35}.sea-log b{font-size:8px;display:block;color:var(--ink)}
  .sheet-toggle{display:none;position:absolute;left:50%;top:3px;transform:translateX(-50%);width:64px;height:20px;border:0;background:transparent;cursor:pointer;z-index:2}.sheet-toggle:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--ink);opacity:.28;margin:auto}.sheet-toggle span{display:none}
  .scene-caption{position:absolute;left:10px;bottom:10px;display:none;min-width:190px;max-width:min(70%,340px);background:rgba(255,247,222,.94);border:3px solid var(--ink);padding:7px 9px;border-radius:7px;box-shadow:3px 3px 0 rgba(22,49,58,.18);font-size:9px;pointer-events:none}.scene-caption.show{display:block}.scene-caption b{display:block;font-size:11px;margin-bottom:2px}.scene-caption span{color:var(--ink-soft);line-height:1.35}
  .map-controls{position:absolute;right:10px;top:10px;display:none;gap:5px;z-index:6}.map-controls.show{display:flex}.map-controls button{width:34px;height:34px;border:3px solid var(--ink);background:var(--paper);border-radius:7px;box-shadow:3px 3px 0 var(--shadow);font-weight:1000;cursor:pointer;color:var(--ink)}.map-controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

    <div class="brand"><div class="brandmark" aria-hidden="true"></div><div><h1>MAKEFAST</h1><small>EVERY FAST GOES SOMEWHERE</small></div></div>

      <div class="map-info" id="mapInfo" aria-live="polite"></div>

      <div class="toast" id="toast"></div>
    </section>

    <aside class="panel" id="infoPanel">
      <div class="panel-head" id="panelHead"><button class="sheet-toggle" id="sheetToggle" aria-label="Show or hide panel"><span>toggle</span></button><h2 id="panelTitle">Home Harbour</h2><p id="panelSubtitle">Plan your next crossing, or spend a little time ashore.</p></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

    <button class="navbtn active" data-view="harbour"><span>⌂</span>HARBOUR</button>

    <button class="navbtn" data-view="log"><span>▤</span>LOG</button>

</div>

function unlockRuleMet(rule){
  if(!rule||rule.type==='always')return true;
  if(rule.type==='known_islands')return state.islands.filter(i=>i.known).length>=rule.count;
  if(rule.type==='home_population')return population(getIsland('home'))>=rule.count;
  if(rule.type==='feature')return completedFeature(getIsland(rule.island||'home'),rule.feature)||getIsland(rule.island||'home').features?.includes(rule.feature);
  if(rule.type==='any')return (rule.rules||[]).some(unlockRuleMet);
  if(rule.type==='all')return (rule.rules||[]).every(unlockRuleMet);
  return false;
}

  $$('[data-close]').forEach(b=>b.onclick=closeModal); $('#modalBack').onclick=e=>{if(closable&&e.target===$('#modalBack'))closeModal()};
}
function closeModal(){$('#modalBack').classList.remove('show')}

function onboarding(){
  showModal(`
    <h2>Welcome to MakeFast</h2>
    <p><b>Every fast goes somewhere.</b> Set up your captain, choose the daily rhythm you usually sail by, then the harbour is yours.</p>
    <div class="onboard-viewport"><div class="onboard-track" id="onboardTrack">
      <div class="onboard-step">
        <div class="notice"><b>Before you set sail</b><br>MakeFast is a fasting timer and game prototype, not medical advice. Fasting is not suitable for everyone. Do not use it if you are under 18, pregnant or breastfeeding, have a history of an eating disorder, or have a condition or medication that makes fasting inappropriate.</div>
        <label style="font-size:9px;font-weight:900">CAPTAIN NAME<br><input id="captainName" maxlength="18" value="Captain" style="width:100%;margin-top:5px;padding:9px;border:3px solid var(--ink);background:#fff;border-radius:6px"></label>
        <div class="modal-actions"><button class="big-btn" id="onboardNext">CHOOSE MY RHYTHM</button></div>
      </div>
      <div class="onboard-step">

        <div class="modal-actions"><button class="big-btn ghost" id="onboardBack">BACK</button><button class="big-btn" id="beginBtn">STEP ABOARD</button></div>
      </div>
    </div></div>

  let step=1;const showStep=n=>{step=n;$('#onboardTrack').classList.toggle('step-2',n===2);$('#onboardDot1').classList.toggle('active',n===1);$('#onboardDot2').classList.toggle('active',n===2)};
  bindRhythmPicker('onboardRhythm');

  $('#beginBtn').onclick=()=>{state.playerName=($('#captainName').value||'Captain').trim().slice(0,18);setDefaultFastHours($('#onboardRhythmSlider').value);state.onboarded=true;save();closeModal();renderUI();toast('Welcome home, '+state.playerName+'.')};

function renderUI(){
  ensureArrived();
  $$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.activeView));
  const chip=$('#phaseChip'); chip.className='phase-chip '+(state.phase==='ashore'?'':state.phase==='arrived'?'arrived':'sea');
  $('#phaseName').textContent=state.phase==='ashore'?'IN HARBOUR':state.phase==='arrived'?'LAND SIGHTED':'AT SEA';
  $('#phaseHint').textContent=state.phase==='ashore'?'Time ashore • open finds & tend the harbour':state.phase==='arrived'?'The harbour is waiting':'Voyage in progress';
  updateHeader();
  if(state.activeView==='harbour')renderHarbourPanel();
  if(state.activeView==='chart')renderChartPanel();
  if(state.activeView==='voyage')renderVoyagePanel();
  if(state.activeView==='log')renderLogPanel();
  if(state.activeView==='settings')renderSettingsPanel();
  updateStageLabel();
  updateMapInfoOverlay();
}

function updateHeader(){
  if(state.phase==='ashore'){$('#headerTimer').textContent=fmtDuration(shoreElapsed());$('#headerSub').textContent='time ashore'}
  else {const ms=actualFastMs();$('#headerTimer').textContent=fmtDuration(ms);$('#headerSub').textContent=state.phase==='arrived'?'lying just offshore':`${Math.round(voyageProgress()*100)}% of the crossing charted`}
  const q=$('#quickPhaseBtn');if(q){q.classList.remove('eat','at-sea');if(state.phase==='ashore'){q.textContent='⚑ SET SAIL';q.title='Start your fasting voyage'}else if(state.phase==='arrived'){q.textContent='⚓ DOCK';q.classList.add('eat');q.title='Begin eating and dock'}else{q.textContent="⚓ I'M EATING";q.classList.add('at-sea');q.title='Make for harbour and begin eating'}}
}
function updateStageLabel(){
  const isl=currentIsland(); let title='',sub='';
  if(minigame){title=minigame.title;sub='take the helm'}
  else if(state.activeView==='chart'){title='YOUR CHART';sub=`${state.islands.filter(i=>i.known).length} places discovered`}
  else if(state.phase==='fasting'||state.phase==='arrived'){title=state.phase==='arrived'?'LAND SIGHTED':'AT SEA';sub=state.voyage?`toward ${getIsland(state.voyage.destinationId).known?state.voyage.destinationName:'uncharted waters'}`:''}
  else {title=isl.name.toUpperCase();sub=isl.home?'the world is happy when you return':`${isl.visits||1} visit${isl.visits===1?'':'s'} • ${isl.biome} coast`}
  $('#stageLabel').innerHTML=`<b>${title}</b><br><span>${sub}</span>`;
  $('#mapControls').classList.toggle('show',!minigame&&state.activeView==='chart');
  updateVoyageStatus();
  if(window.matchMedia('(max-width:900px)').matches)fitResponsiveStage();
}
function updateVoyageStatus(){
  const el=$('#voyageStatus');if(!el)return;const mobileCollapsed=window.matchMedia('(max-width:900px)').matches&&mobilePanelCollapsed;const active=!minigame&&(state.phase==='fasting'||state.phase==='arrived')&&!mobileCollapsed;el.classList.toggle('show',active);if(active){const v=state.voyage,p=voyageProgress(),dest=getIsland(v.destinationId),remaining=voyageRemainingMs();el.querySelector('b').textContent=state.phase==='arrived'?'LAND SIGHTED':`${Math.round(p*100)}% CHARTED`;el.querySelector('span').textContent=state.phase==='arrived'?`${dest.name} lies just ahead.`:`${fmtDuration(remaining,true)} to ${dest.known?dest.name:'land'}`}
  updateVoyagePeek();
}
let voyageNoticeTimer=null;
function updateVoyagePeek(){const el=$('#voyagePeek');if(!el)return;const show=window.matchMedia('(max-width:900px)').matches&&mobilePanelCollapsed&&!minigame&&(state.phase==='fasting'||state.phase==='arrived');el.classList.toggle('show',show);if(!show)return;const p=voyageProgress(),v=state.voyage,dest=getIsland(v.destinationId),remaining=voyageRemainingMs();$('#voyagePeekTitle').textContent=state.phase==='arrived'?`⚑ ${dest.known?dest.name:'LAND SIGHTED'}`:`${Math.round(p*100)}% CHARTED`;$('#voyagePeekTime').textContent=state.phase==='arrived'?'ready to dock':fmtDuration(remaining,true)+' to land';$('#voyagePeekFill').style.width=(p*100)+'%'}
function openVoyageFromOverlay(){state.activeView='voyage';mobilePanelCollapsed=false;syncMobilePanel();save();renderUI()}
function showVoyageNotice(title,text='Tap to open Voyage'){const el=$('#voyageNote');if(!el||!window.matchMedia('(max-width:900px)').matches||!mobilePanelCollapsed||state.phase==='ashore'||minigame)return;$('#voyageNoteTitle').textContent=title;$('#voyageNoteText').textContent=text;el.classList.add('show');clearTimeout(voyageNoticeTimer);voyageNoticeTimer=setTimeout(()=>el.classList.remove('show'),5200)}
function notifyVoyage(title,text,plain=title){const collapsed=window.matchMedia('(max-width:900px)').matches&&mobilePanelCollapsed&&state.phase!=='ashore';if(collapsed)showVoyageNotice(title,text);else toast(plain)}
function updateVoyageEncounterOverlay(){
  const el=$('#voyageEncounter');if(!el)return;const hiddenBySheet=window.matchMedia('(max-width:900px)').matches&&mobilePanelCollapsed;const e=!hiddenBySheet&&!minigame&&state.phase==='fasting'?activeVoyageEvent():null;el.classList.toggle('show',!!e);if(!e)return;

  $('#voyageEncounterLook').onclick=()=>investigateVoyageEvent(e.id);$('#voyageEncounterPass').onclick=()=>letVoyageEventPass(e.id);

  const centers=[[240,150],[400,150],[240,250],[400,250]],cols=['#df7c68','#e5b54e','#65bdd1','#83bf6a'];centers.forEach((c,i)=>{const lit=g.phase==='show'&&g.seq[g.flashIndex]===i;circle(c[0],c[1],38,lit?'#fff7de':cols[i],'#18313a',5);if(lit)circle(c[0],c[1],18,'rgba(255,255,255,.55)');pxText(String(i+1),c[0],c[1]+5,'#18313a',14,'center')});pxText(g.phase==='input'?MINIGAME_META.signal.inputText:MINIGAME_META.signal.watchText,320,58,'#fff7de',12,'center');pxText(`SHORE SIGNALS READ: ${g.score}`,320,330,'#dff5f4',8,'center');
}
function renderWind(g,ts){
  drawSeaBackground();if(ts>g.nextShift){g.target=.15+Math.random()*.7;g.nextShift=ts+3900}if(pointer.down)g.angle=clamp(pointer.x/640,0,1);const diff=Math.abs(g.angle-g.target);if(diff<.07){g.hold+=16;if(g.hold>850){g.score++;g.hold=0;g.target=.15+Math.random()*.7;beep('soft')}}else g.hold=Math.max(0,g.hold-11);
  drawTopBoat(320,225,1.25,0,state.boat.type,playerBoatAppearance());const x=70+g.angle*500,tx=70+g.target*500;roundedRect(70,92,500,14,4,'#fff','#18313a',2);rect(tx-20,88,40,22,'#83bf6a');rect(x-4,80,8,38,'#18313a');rect(525,120,4,40,'#18313a');poly([[529,124],[560,132],[529,138]],'#df7c68','#18313a',1);pxText(MINIGAME_META.wind.title,22,28,'#fff7de',12);pxText(MINIGAME_META.wind.instruction,320,340,'#fff7de',8,'center');
}
function renderWildlife(g,ts){
  drawSeaBackground();if(ts-g.spawn>720){g.spawn=ts;if(g.animals.length<6)g.animals.push({x:45+Math.random()*550,y:75+Math.random()*205,born:ts,kind:Math.random()<.62?'dolphin':'bird'})}g.animals=g.animals.filter(a=>ts-a.born<2500);g.animals.forEach(a=>{const bob=Math.sin(ts*.01+a.x)*4;if(a.kind==='dolphin'){poly([[a.x-13,a.y+bob],[a.x+4,a.y+bob-2],[a.x+12,a.y+bob+1],[a.x+4,a.y+bob+4],[a.x-8,a.y+bob+4]],'#2f6f85','#173a4a',1);rect(a.x+8,a.y-4+bob,8,4,'#2f6f85')}else{rect(a.x-9,a.y+bob,8,2,'#fff7de');rect(a.x+1,a.y+bob,8,2,'#fff7de');rect(a.x-1,a.y+bob-2,2,4,'#fff7de')}});drawTopBoat(320,295,1,0,state.boat.type,playerBoatAppearance());rect(0,0,56,360,'rgba(16,37,48,.3)');rect(584,0,56,360,'rgba(16,37,48,.3)');pxText(MINIGAME_META.wildlife.title,22,28,'#fff7de',12);pxText(MINIGAME_META.wildlife.instruction,320,340,'#fff7de',8,'center');
}
function renderSoundings(g,ts){
  rect(0,0,640,360,'#214f67');roundedRect(96,58,448,260,8,'#f5e8c7','#18313a',3);const left=128,top=88,cw=64,ch=58;for(let y=0;y<4;y++)for(let x=0;x<6;x++){rect(left+x*cw,top+y*ch,cw-2,ch-2,(x+y)%2?'#d8e3c5':'#e7edd0');pxText(`${x+1}${String.fromCharCode(65+y)}`,left+x*cw+6,top+y*ch+14,'#6e795e',7)}
  g.pings.forEach(p=>{const cx=left+p.gx*cw+cw/2,cy=top+p.gy*ch+ch/2;circle(cx,cy,6,p.d<1.5?'#df7c68':p.d<2.7?'#e5b54e':'#65bdd1','#18313a',1)});pxText(MINIGAME_META.soundings.title,22,28,'#fff7de',12);pxText(g.lastHint,320,338,'#fff7de',8,'center');
}
function renderRepair(g,ts){
  drawSeaBackground();roundedRect(115,70,410,235,12,'#b98359','#18313a',4);for(let x=130;x<510;x+=34)rect(x,78,3,215,'rgba(88,52,34,.2)');
  if(ts-g.spawn>950&&g.leaks.length<7){g.spawn=ts;g.leaks.push({x:150+Math.random()*340,y:105+Math.random()*160,born:ts})}if(ts>g.waveAt){g.waveAt=ts+5000;g.leaks.forEach(l=>l.born-=900);}
  g.leaks=g.leaks.filter(l=>ts-l.born<5000);g.leaks.forEach(l=>{const age=(ts-l.born)/5000;circle(l.x,l.y,9,'#65bdd1','#18313a',2);circle(l.x,l.y,3,'#dff5f4');if(age>.7)drawSparkle(l.x+10,l.y-8,'#dff5f4')});pxText(MINIGAME_META.repair.title,22,28,'#fff7de',12);pxText(MINIGAME_META.repair.instruction,320,340,'#fff7de',8,'center');
}
const VOYAGE_SCENE_RENDERERS={
  npcboat(e,ts,bx,by,t){const v=worldState().vessels.find(x=>x.id===e.vesselId);if(!v)return;const W=canvas.width,vr=visibleSceneRect(),type=vesselType(v.typeId),fromLeft=(hashString(v.id)%2)===0,x=fromLeft?(-70+t*(W+140)):(W+70-t*(W+140)),y=vr.y+vr.h*.22+Math.sin(t*Math.PI)*28;drawTopBoat(x,y,.68,fromLeft?.25:-.25,type.sprite,npcBoatAppearance(v));},
  dolphins(e,ts,bx,by,t){for(let i=0;i<4;i++){const x=bx+85+i*30-(t*165),y=by-34+Math.sin(t*12+i)*14;drawSeaSprite('dolphin',x,y,.78,(i%2)===0,i)}},
  wildlife(e,ts,bx,by,t){VOYAGE_SCENE_RENDERERS.dolphins(e,ts,bx,by,t)},
  seabirds(e,ts,bx,by,t){for(let i=0;i<6;i++){const x=20+t*(canvas.width-40)+i*18,y=visibleSceneRect().y+45+i%3*11;drawSeaSprite('gull',x,y,.8,(i%2)===0,i)}},
  trader(e,ts,bx,by,t){drawTopBoat(canvas.width+20-t*(canvas.width+100),visibleSceneRect().y+70,.55,-.35,'sailer',defaultBoatAppearance('sailer'))},
  squall(e,ts,bx,by,t){const x=canvas.width-t*(canvas.width+180);rect(x,0,180,canvas.height,'rgba(38,71,83,.28)');for(let i=0;i<28;i++)rect(x+10+(i*31)%170,40+(i*47)%Math.max(100,canvas.height-50),1,8,'rgba(240,252,255,.48)')},
  bottle(e,ts,bx,by,t){drawSeaSprite('bottle',bx+76,by-40,.9,false,0);drawSparkle(bx+89,by-50,'#fff7de')},
  signal(e,ts,bx,by,t){const pulse=(Math.sin(ts*.008)>0)?1:0,x=canvas.width*.84,y=visibleSceneRect().y+55;circle(x,y,5,pulse?'#fff7de':'#df7c68');if(pulse)circle(x,y,14,'rgba(255,247,222,.12)')},
  shoal(e,ts,bx,by,t){for(let i=0;i<8;i++){const x=bx+80+(i%4)*16,y=by+60+Math.floor(i/4)*13;rect(x,y,9,3,'rgba(32,91,112,.65)')}},
  shipwreck(e,ts,bx,by,t){const vr=visibleSceneRect(),x=canvas.width*.72,y=clamp(by-70,vr.y+80,vr.y+vr.h-90);drawSeaSprite('wreck',x,y,1.05,false,0);if(Math.sin(ts*.006)>0)drawSparkle(x+29,y-23,'#fff7de')},
  seaglass(e,ts,bx,by,t){const vr=visibleSceneRect(),x=canvas.width*.68,y=clamp(by+62,vr.y+90,vr.y+vr.h-60);drawSeaSprite('seaglass',x,y,1.05,false,0);if(Math.sin(ts*.01)>0)drawSparkle(x+18,y-12,'#fff7de')},
  rigging(e,ts,bx,by,t){for(let i=0;i<4;i++){const x=bx-22+i*14,y=by-30+Math.sin(ts*.02+i)*6;rect(x,y,10,2,'#fff7de')}},
  breeze(e,ts,bx,by,t){const vr=visibleSceneRect();for(let i=0;i<Math.max(6,Math.floor(canvas.height/80));i++){const x=((i*120+ts*.08)%(canvas.width+120))-60;rect(x,vr.y+35+i*50,42,2,'rgba(255,255,255,.45)')}},
  castaway(e,ts,bx,by,t){drawTopBoat(bx+78,by-48,.62,.15,'shallow',defaultBoatAppearance('shallow'));drawTopVillager(bx+78,by-55,'#b48cc7','#e5b54e',1)},
  stonecargo(e,ts,bx,by,t){for(let i=0;i<4;i++)drawTopRock(bx+62+i*12,by+48+(i%2)*8,.55)},
  canvas(e,ts,bx,by,t){VOYAGE_SCENE_RENDERERS.breeze(e,ts,bx,by,t);rect(bx+74,by-35,22,12,'#fff7de');rect(bx+77,by-32,16,2,'#df7c68')}
};
function drawVoyageSceneEvent(e,ts,bx,by){if(!e)return;const age=ts-(e.started||ts),t=clamp(age/(e.duration||12000),0,1);if(t>=1&&e.ambient){sceneEvent=null;return}VOYAGE_SCENE_RENDERERS[e.scene||e.type]?.(e,ts,bx,by,t)}

function animationLoop(ts){lastTs=ts;ensureArrived();processVoyageEvents();const mobile=window.matchMedia('(max-width:900px)').matches,minGap=mobile?33:16;if(ts-lastPaintAt>=minGap){lastPaintAt=ts;updateHeader();updateVoyageStatus();updateVoyageEncounterOverlay();renderScene(ts)}requestAnimationFrame(animationLoop)}

// UI events
$$('.navbtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#sheetToggle').onclick=e=>{e.stopPropagation();toggleMobilePanel()};$('#panelHead').onclick=e=>{if(e.target.closest('button'))return;if(window.matchMedia('(max-width:900px)').matches)toggleMobilePanel()};
$('#mapZoomIn').onclick=()=>zoomChart(.2);$('#mapZoomOut').onclick=()=>zoomChart(-.2);$('#mapReset').onclick=()=>{resetChartView();fitChartToKnown();updateMapInfoOverlay()};
$('#quickPhaseBtn').onclick=()=>{if(minigame)endMinigame('leave');if(state.phase==='ashore')startVoyage();else if(state.phase==='arrived')dock(false);else earlyDockPrompt()};
$('#voyagePeek').onclick=openVoyageFromOverlay;$('#voyageNote').onclick=openVoyageFromOverlay;
window.addEventListener('resize',()=>{fitResponsiveStage();syncMobilePanel()});
window.addEventListener('beforeunload',()=>{simulateWorldTo(nowReal(),false);save()});
setInterval(()=>{simulateWorldTo(nowReal(),false);save();if(['harbour','chart','log','voyage'].includes(state.activeView))renderUI()},60000);
setInterval(()=>{if(state.sim?.active&&state.phase!=='ashore'){/* preview uses real time */}},1000);

window.__MakeFastBoat={createBoatSprite,renderBoatPreviewCanvas,playerBoatAppearance,defaultBoatAppearance,npcBoatAppearance,boatTypes:BOAT_TYPES,npcTypes:NPC_VESSEL_TYPES};
window.__MakeFastArt={buildingSprite,residentSprite,propSprite,seaSprite,drawPixelSprite,worldSpriteCache,islandArt:ISLAND_ART,visibleResidentLimit};

// Start
const startupWorldGap=Math.max(0,nowReal()-(worldState().lastSimAt||nowReal()));simulateWorldTo(nowReal(),startupWorldGap>10*60000);save();fitResponsiveStage();syncMobilePanel();renderUI();requestAnimationFrame(animationLoop);if(!state.onboarded)setTimeout(onboarding,120);else if(startupWorldGap>10*60000&&worldState().pendingSummary.length)setTimeout(showOfflineWorldSummary,260);

})();
</script>
